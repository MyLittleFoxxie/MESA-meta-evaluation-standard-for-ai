# Case Studies — Overview

**MESA** (Meta-Evaluation Standard for AI Benchmarks) treats an AI benchmark as a formal
*measurement instrument* rather than a scoreboard. It adapts the psychometric **EFPA Test
Review Model** into a requirements-oriented framework for auditing benchmarks before their
scores are trusted to back capability, safety, or procurement claims.

Every review uses the unified **Part A + Part B** template:

- **Part A — Description.** A standardized "spec sheet": what the benchmark claims to measure,
  how it is administered and scored, and which materials are available to inspect, run, or reproduce it.
- **Part B — Evaluation.** EFPA-style `n/a` and `0`–`4` ratings judging whether the available
  evidence supports the meaning users are supposed to draw from a score.

## How the case studies are produced

Each case study is generated by a multi-LLM review pipeline designed to keep the process
auditable and to reduce single-model bias:

1. **Two independent reviewer drafts.** Two different models each review the same benchmark from
   the same source packet, without seeing each other's work:
   - **Reviewer 1** (`chatgpt_reviewer1`)
   - **Reviewer 2** (`claude_reviewer2`)
2. **Supervising-editor reconciliation.** A **supervising editor** model
   (`gemini_supervising_editor`) reconciles the two drafts into a single, source-grounded review —
   resolving rating discrepancies with explicit editorial rationale, and recording unresolved
   evidence gaps and interpretation cautions.

## How to read a case study

The **Reconciled — Supervising Editor** version is the authoritative review and is shown by
default. The two reviewer drafts are provided alongside it for transparency and traceability, so
you can see how independent judgments differed and how they were reconciled. Use the **Reviewer**
selector on the Case Studies tab to switch between the reconciled review and either draft.

The pilot benchmarks are **Humanity's Last Exam (HLE)**, **ARC-AGI-2**, and **DesignQA**. They
illustrate how MESA separates supported narrow interpretations from broader claims about general
intelligence or agency that the benchmark evidence alone does not support.
