<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MESA — Interactive Benchmark Review Form</title>
  <meta name="description" content="Fillable web form for the MESA Meta-Evaluation Standard for AI benchmarks, generated live from the canonical template." />
  <link rel="stylesheet" href="assets/mesa-form.css" />
</head>
<body>
  <header class="mesa-topbar">
    <h1>MESA — Benchmark Review</h1>
    <span id="mesa-progress"></span>
    <span class="spacer"></span>
    <nav class="mesa-toolbar">
      <button id="btn-print" type="button" title="Save the completed review as PDF via your browser's print dialog">Print / Save PDF</button>
      <button id="btn-expand" type="button" data-state="">Collapse all</button>
      <button id="btn-reset" type="button" title="Clear answers saved in this browser">Reset</button>
      <label class="filebtn" title="Use if the template did not load automatically (e.g. opened via file://)">
        Load template file…
        <input id="file-loader" type="file" accept=".md,text/markdown,text/plain" />
      </label>
    </nav>
  </header>

  <div class="mesa-wrap">
    <aside class="mesa-nav">
      <h2>Contents</h2>
      <div id="mesa-toc"></div>
    </aside>
    <main class="mesa-main">
      <div id="mesa-status"></div>
      <div id="mesa-orphan-note"></div>
      <form id="mesa-form" autocomplete="off"></form>
    </main>
  </div>

  <!-- Vendored offline libraries (no CDN / network needed) -->
  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/vendor/mermaid.min.js"></script>
  <script src="assets/mesa-form.js"></script>
</body>
</html>
