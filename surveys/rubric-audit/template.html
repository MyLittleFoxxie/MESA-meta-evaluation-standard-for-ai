<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MESA Benchmark Audit Workbench: HumanEval</title>
<style>
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --bg: #f4f7f9;
  --surface: #ffffff;
  --text: #1a2730;
  --muted: #576d7d;
  --line: #d1dde5;
  --primary: #0a647d;
  --primary-hover: #085064;
  --primary-soft: #eaf4f7;
  --accent: #d97706;
  --success: #15803d;
  --success-soft: #dcfce7;
  --danger: #b91c1c;
  --danger-soft: #fee2e2;
  --badge-checked: #166534;
  --badge-shown: #1e40af;
  --badge-stated: #b45309;
  --badge-contra: #991b1b;
  --badge-undoc: #475569;
}
:root[data-theme="dark"] {
  --bg: #0f171d;
  --surface: #17232b;
  --text: #e6eef3;
  --muted: #95abb9;
  --line: #2b3e4c;
  --primary: #40a2be;
  --primary-hover: #5ab6d1;
  --primary-soft: #18333e;
  --accent: #f59e0b;
  --success: #22c55e;
  --success-soft: #143822;
  --danger: #ef4444;
  --danger-soft: #451a1a;
  --badge-checked: #22c55e;
  --badge-shown: #60a5fa;
  --badge-stated: #fbbf24;
  --badge-contra: #f87171;
  --badge-undoc: #94a3b8;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; font-size: 15px; }
header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 20px; position: sticky; top: 0; z-index: 50; }
.header-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.header-title h1 { margin: 0; font-size: 1.15rem; font-weight: 700; line-height: 1.2; }
.header-title p { margin: 2px 0 0; font-size: 0.82rem; color: var(--muted); }
.header-controls { display: flex; align-items: center; gap: 10px; }
button { font-family: inherit; font-size: 0.88rem; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; transition: background 0.15s, border-color 0.15s; }
button:hover { background: var(--primary-soft); border-color: var(--primary); }
button.primary { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
button.primary:hover { background: var(--primary-hover); }
.theme-btn { border-radius: 50%; width: 34px; height: 34px; padding: 0; display: inline-grid; place-items: center; }

/* Workbench Layout */
.workbench { display: grid; grid-template-columns: minmax(420px, 1fr) minmax(460px, 1.15fr); gap: 0; height: calc(100vh - 61px); }
@media (max-width: 960px) {
  .workbench { display: flex; flex-direction: column; height: auto; }
}

/* Left Pane: Sources Inspector */
.left-pane { border-right: 1px solid var(--line); display: flex; flex-direction: column; background: var(--surface); height: 100%; overflow: hidden; }
.pane-header { padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--primary-soft); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pane-header h2 { margin: 0; font-size: 0.88rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; }
.file-tabs { display: flex; gap: 4px; overflow-x: auto; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.tab-btn { font-size: 0.8rem; padding: 4px 9px; border-radius: 4px; border: 1px solid transparent; background: transparent; white-space: nowrap; }
.tab-btn.active { background: var(--primary-soft); color: var(--primary); font-weight: 700; border-color: var(--line); }
.file-search-bar { padding: 6px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
.search-input { width: 100%; font-family: inherit; font-size: 0.82rem; padding: 5px 8px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
.file-viewer { flex: 1; overflow-y: auto; padding: 10px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.code-line { display: block; padding: 1px 4px; border-radius: 2px; }
.code-line.highlight { background: #fef08a !important; color: #854d0e !important; font-weight: 700; outline: 2px solid #eab308; }
:root[data-theme="dark"] .code-line.highlight { background: #854d0e !important; color: #fef08a !important; }

/* Right Pane: Audit Flow */
.right-pane { display: flex; flex-direction: column; height: 100%; overflow-y: auto; background: var(--bg); padding: 16px 20px; }
.audit-container { max-width: 760px; margin: 0 auto; width: 100%; }

/* Progress bar */
.progress-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.progress-bar-wrap { flex: 1; height: 7px; background: var(--line); border-radius: 4px; overflow: hidden; }
.progress-bar { height: 100%; width: 0%; background: var(--primary); transition: width 0.2s ease; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
.badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #fff; }
.badge.checked { background: var(--badge-checked); }
.badge.shown { background: var(--badge-shown); }
.badge.stated { background: var(--badge-stated); }
.badge.contradicted { background: var(--badge-contra); }
.badge.undoc, .badge.insufficient_evidence, .badge.not_applicable { background: var(--badge-undoc); }

.claim-box { background: var(--primary-soft); border-left: 4px solid var(--primary); padding: 10px 12px; border-radius: 0 6px 6px 0; margin: 10px 0 14px; }
.claim-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; font-size: 0.88rem; }
.claim-reason { font-size: 0.9rem; margin: 3px 0 0; }

.evidence-quote-box { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 6px 0; font-size: 0.85rem; }
.evidence-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 3px; font-weight: 600; color: var(--muted); font-size: 0.82rem; }
.quote-text { font-style: italic; color: var(--text); border-left: 2px solid var(--line); padding-left: 8px; margin: 3px 0; font-family: var(--font-mono); font-size: 0.82rem; }
.inspect-btn { font-size: 0.75rem; padding: 3px 7px; background: var(--primary-soft); color: var(--primary); border: 1px solid var(--line); font-weight: 600; }

.verdict-group { margin: 12px 0; display: grid; gap: 6px; }
.verdict-option { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
.verdict-option:hover { background: var(--primary-soft); }
.verdict-option:has(input:checked) { background: var(--primary-soft); border-color: var(--primary); font-weight: 600; }
.verdict-option input { margin-top: 3px; accent-color: var(--primary); }

.details-drawer { margin-top: 10px; font-size: 0.82rem; color: var(--muted); }
.details-drawer summary { cursor: pointer; font-weight: 600; margin-bottom: 4px; }

textarea.note-input { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 7px; font-family: inherit; font-size: 0.85rem; background: var(--surface); color: var(--text); margin-top: 4px; resize: vertical; min-height: 42px; }

.nav-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); }
.save-toast { font-size: 0.8rem; color: var(--muted); }

/* Steps and Levels vertical layout */
.vertical-card-list { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
.vertical-item { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; display: flex; align-items: center; gap: 12px; font-size: 0.86rem; }
.vertical-item .num-badge { width: 24px; height: 24px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.78rem; flex: none; }

/* Primer code preview */
.code-preview-box { background: #1e293b; color: #f8fafc; border-radius: 6px; padding: 12px; font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.5; overflow-x: auto; margin: 10px 0; }
.code-preview-box .comment { color: #94a3b8; font-style: italic; }
.code-preview-box .keyword { color: #38bdf8; font-weight: 600; }
.code-preview-box .func { color: #fbbf24; }

/* Familiarity radio scale */
.familiarity-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
.familiarity-title { font-weight: 650; font-size: 0.92rem; margin-bottom: 2px; }
.familiarity-help { font-size: 0.82rem; color: var(--muted); margin-bottom: 8px; }
.familiarity-scale { display: grid; gap: 6px; }
.familiarity-opt { display: flex; align-items: flex-start; gap: 8px; font-size: 0.85rem; padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px; cursor: pointer; }
.familiarity-opt:hover { background: var(--primary-soft); }
.familiarity-opt:has(input:checked) { background: var(--primary-soft); border-color: var(--primary); font-weight: 600; }
.familiarity-opt input { margin-top: 2px; accent-color: var(--primary); }

/* Inline Hover Tooltip styles */
.term { display: inline; font: inherit; font-weight: inherit; color: inherit; background: none; border: 0; border-bottom: 1px dotted var(--muted); border-radius: 0; padding: 0; min-height: 0; cursor: help; line-height: inherit; }
.term-icon { display: inline-flex; align-items: center; justify-content: center; font-size: .62em; font-weight: 700; border: 1px solid currentColor; border-radius: 50%; width: 1.2em; height: 1.2em; vertical-align: super; margin-left: 2px; }
.term-tip { position: fixed; inset: auto; margin: 0; padding: 12px 14px; max-width: min(340px, calc(100vw - 24px)); background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 5px 22px rgba(0,0,0,0.22); z-index: 1000; font-size: 0.88rem; line-height: 1.45; }
.term-tip p { margin: 0; }
.term-tip strong { display: block; margin-bottom: 4px; color: var(--primary); font-size: 0.92rem; }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="header-title">
      <h1>MESA Benchmark Audit: HumanEval (OpenAI Codex)</h1>
      <p>Human Software Engineering Audit of Claude Sonnet 5.5's Meta-Evaluation Review</p>
    </div>
    <div class="header-controls">
      <span id="save-notice" class="save-toast">Draft saved</span>
      <button id="theme-toggle" type="button" class="theme-btn" aria-label="Toggle theme">🌙</button>
      <button id="export-json-btn" type="button">Download JSON</button>
      <button id="export-csv-btn" type="button" class="primary">Export CSV for Paper</button>
    </div>
  </div>
</header>

<div class="workbench">
  <!-- LEFT PANE: Benchmark Sources & Code Viewer -->
  <section class="left-pane" aria-label="Benchmark Sources Viewer">
    <div class="pane-header">
      <h2>Evidence Inspector</h2>
      <span id="active-file-label" style="font-size: 0.8rem; font-weight: 600; color: var(--muted);">Official PDF (Chen et al. 2021)</span>
    </div>
    <div class="file-tabs" id="file-tabs-container"></div>
    
    <!-- Code/Text Search Bar -->
    <div class="file-search-bar" id="file-search-bar" style="display: none;">
      <input type="text" id="file-search" class="search-input" placeholder="Filter lines in current file..." aria-label="Search current file">
    </div>
    
    <!-- Code/Text Content Viewer -->
    <div class="file-viewer" id="file-viewer-content" style="display: none;"></div>

    <!-- Dual-Mode PDF Viewer Container -->
    <div id="pdf-viewer-container" style="display: flex; flex-direction: column; flex: 1; height: 100%; position: relative;">
      <div style="padding: 6px 12px; background: var(--primary-soft); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem;">
        <span><strong>Official Research Paper</strong> (Chen et al., 2021, 35 pages)</span>
        <a id="open-pdf-ext" href="paper.pdf" target="_blank" rel="noopener noreferrer" style="color: var(--primary); font-weight: 600; text-decoration: none;">↗ Open PDF in New Window</a>
      </div>
      <iframe id="pdf-frame" src="paper.pdf#page=1" style="width: 100%; flex: 1; border: none;" title="Official HumanEval Paper PDF"></iframe>
    </div>
  </section>

  <!-- RIGHT PANE: Audit Question Flow -->
  <main class="right-pane" id="main-flow" aria-label="MESA Audit Questionnaire">
    <div class="audit-container">
      <div class="progress-card">
        <span id="progress-text" style="font-weight: 600; font-size: 0.86rem;">Item 1 of 40</span>
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progress-bar-fill"></div>
        </div>
      </div>

      <div id="card-mount"></div>

      <div class="nav-row">
        <button type="button" id="prev-btn">◀ Previous</button>
        <button type="button" id="next-btn" class="primary">Next Item ▶</button>
      </div>
    </div>
  </main>
</div>

<!-- Floating Hover Popover -->
<div id="term-tip" class="term-tip" popover="manual" role="tooltip"></div>

<script id="packet-data" type="application/json">__PACKET_JSON__</script>

<script>
'use strict';
const packet = JSON.parse(document.getElementById('packet-data').textContent);
const STORAGE_KEY = 'mesa_humaneval_audit_v1';

// Auditor state
let state = {
  activeTab: 'Official PDF (Chen et al. 2021)',
  stepIndex: 0, // 0 = Intro & Familiarity, 1..8 = Part A, 9..37 = Part B, 38 = Feedback, 39 = Export
  familiarity: {
    ai: null,
    benchmarks: null,
    python: null,
    scores: null
  },
  answers: {
    part_a: {}, // facet -> { verdict, note }
    part_b: {}, // qid -> { verdict, note }
  },
  feedback: {}, // id -> rating
  feedback_comment: ''
};

// Load draft
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    const parsed = JSON.parse(saved);
    state = Object.assign(state, parsed);
    if (!state.familiarity) state.familiarity = {};
  }
} catch (e) {}

function saveDraft() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const el = document.getElementById('save-notice');
    el.textContent = 'Draft auto-saved';
    setTimeout(() => el.textContent = 'Draft saved', 2000);
  } catch (e) {}
}

// Inline Definitions and Tooltip Engine
const aliases = new Map();
if (packet.definitions) {
  for (const d of packet.definitions) {
    if (d.aliases) {
      for (const a of d.aliases) aliases.set(a.toLowerCase(), d);
    } else if (d.term) {
      aliases.set(d.term.toLowerCase(), d);
    }
  }
}
const escapeRx = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const termRx = aliases.size > 0
  ? new RegExp('\\b(' + Array.from(aliases.keys()).sort((a,b) => b.length - a.length).map(escapeRx).join('|') + ')\\b', 'gi')
  : null;

function annotate(root) {
  if (!termRx) return;
  for (const term of root.querySelectorAll('.term')) {
    term.querySelector('.term-icon')?.remove();
    term.replaceWith(document.createTextNode(term.textContent));
  }
  root.normalize();
  const counts = new Map();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest('button,a,textarea,input,script,style,summary,.code-line,pre,code,.term-tip,.sr')
      ? NodeFilter.FILTER_REJECT
      : NodeFilter.FILTER_ACCEPT
  });
  const texts = [];
  while (walker.nextNode()) texts.push(walker.currentNode);
  for (const text of texts) {
    termRx.lastIndex = 0;
    const matches = [...text.textContent.matchAll(termRx)].filter(m => {
      const d = aliases.get(m[0].toLowerCase());
      const label = d.label || d.term;
      const n = counts.get(label) || 0;
      counts.set(label, n + 1);
      return n % 2 === 0;
    });
    if (!matches.length) continue;
    const frag = document.createDocumentFragment();
    let offset = 0;
    for (const m of matches) {
      frag.append(document.createTextNode(text.textContent.slice(offset, m.index)));
      const d = aliases.get(m[0].toLowerCase());
      const label = d.label || d.term;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'term';
      b.dataset.term = label;
      b.setAttribute('aria-label', m[0] + ': show definition');
      b.textContent = m[0];
      const icon = document.createElement('span');
      icon.className = 'term-icon';
      icon.setAttribute('aria-hidden', 'true');
      icon.textContent = '?';
      b.append(icon);
      frag.append(b);
      offset = m.index + m[0].length;
    }
    frag.append(document.createTextNode(text.textContent.slice(offset)));
    text.replaceWith(frag);
  }
}

const tip = document.getElementById('term-tip');
let tipButton = null, tipPinned = false, tipTimer;
function hideTip() {
  clearTimeout(tipTimer);
  if (tip && tip.matches && tip.matches(':popover-open')) tip.hidePopover();
  tipButton = null;
  tipPinned = false;
}
function showTip(button, pinned = false) {
  clearTimeout(tipTimer);
  tipButton = button;
  tipPinned = pinned;
  const d = packet.definitions.find(d => (d.label || d.term) === button.dataset.term);
  if (!d) return;
  tip.innerHTML = `<strong>${d.label || d.term}</strong><p>${d.definition}</p>`;
  if (tip.showPopover && !tip.matches(':popover-open')) {
    tip.showPopover();
  }
  const r = button.getBoundingClientRect();
  const t = tip.getBoundingClientRect();
  tip.style.left = Math.max(12, Math.min(r.left, innerWidth - (t.width || 300) - 12)) + 'px';
  tip.style.top = Math.max(12, Math.min(r.bottom + 8, innerHeight - (t.height || 120) - 12)) + 'px';
}
function laterHide() {
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => {
    if (!tipPinned && (!tip.matches || !tip.matches(':hover')) && document.activeElement !== tipButton) hideTip();
  }, 180);
}
document.addEventListener('pointerover', e => {
  const b = e.target.closest('.term');
  if (b && (!tipPinned || b === tipButton)) showTip(b, tipPinned);
});
document.addEventListener('pointerout', e => {
  if (e.target.closest('.term')) laterHide();
});
if (tip) {
  tip.addEventListener('pointerenter', () => clearTimeout(tipTimer));
  tip.addEventListener('pointerleave', laterHide);
}
document.addEventListener('focusin', e => {
  if (e.target.matches && e.target.matches('.term')) showTip(e.target);
  else if (!tipPinned) hideTip();
});
document.addEventListener('focusout', e => {
  if (e.target.matches && e.target.matches('.term')) laterHide();
});
document.addEventListener('click', e => {
  const b = e.target.closest('.term');
  if (b) showTip(b, true);
  else if (!e.target.closest('#term-tip')) hideTip();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') hideTip();
});
window.addEventListener('resize', hideTip);

// File Tabs and Dual-Mode Viewer
const tabsContainer = document.getElementById('file-tabs-container');
const fileViewer = document.getElementById('file-viewer-content');
const fileSearchBar = document.getElementById('file-search-bar');
const pdfContainer = document.getElementById('pdf-viewer-container');
const pdfFrame = document.getElementById('pdf-frame');
const activeFileLabel = document.getElementById('active-file-label');

const allFiles = {
  'Official PDF (Chen et al. 2021)': '__PDF__',
  'Paper Text': packet.benchmark.paper_text,
  ...packet.benchmark.repo_files
};

function renderTabs() {
  tabsContainer.innerHTML = '';
  Object.keys(allFiles).forEach(fileName => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (state.activeTab === fileName ? ' active' : '');
    btn.textContent = fileName.startsWith('Official PDF') ? '📄 Official PDF' : (fileName === 'Paper Text' ? '📝 Paper Text' : fileName.split('/').pop());
    btn.title = fileName;
    btn.onclick = () => selectTab(fileName);
    tabsContainer.appendChild(btn);
  });
}

function selectTab(fileName, highlightQuote) {
  state.activeTab = fileName;
  activeFileLabel.textContent = fileName;
  renderTabs();

  if (fileName === 'Official PDF (Chen et al. 2021)') {
    pdfContainer.style.display = 'flex';
    fileSearchBar.style.display = 'none';
    fileViewer.style.display = 'none';
    // If quote mentions page number e.g. "page 4", jump iframe
    if (highlightQuote) {
      const pageMatch = highlightQuote.match(/page\s+(\d+)/i);
      if (pageMatch) {
        pdfFrame.src = 'paper.pdf#page=' + pageMatch[1];
      }
    }
  } else {
    pdfContainer.style.display = 'none';
    fileSearchBar.style.display = 'flex';
    fileViewer.style.display = 'block';
    renderFileContent(highlightQuote);
  }
}

function renderFileContent(highlightQuote) {
  const content = allFiles[state.activeTab] || '';
  const filter = (document.getElementById('file-search').value || '').toLowerCase();
  const lines = content.split('\n');
  
  fileViewer.innerHTML = '';
  let targetLineEl = null;
  let maxScore = 0;

  const cleanWords = (highlightQuote || '').toLowerCase().replace(/[^a-z0-9_\s]/g, ' ').split(/\s+/).filter(w => w.length > 3);

  lines.forEach((line, idx) => {
    if (filter && !line.toLowerCase().includes(filter)) return;
    const lineEl = document.createElement('span');
    lineEl.className = 'code-line';
    lineEl.textContent = (idx + 1).toString().padStart(4, ' ') + ': ' + line;
    
    if (cleanWords.length > 0) {
      const lineLower = line.toLowerCase();
      let score = 0;
      cleanWords.forEach(w => { if (lineLower.includes(w)) score++; });
      if (score >= Math.min(2, cleanWords.length)) {
        lineEl.classList.add('highlight');
        if (score > maxScore) {
          maxScore = score;
          targetLineEl = lineEl;
        }
      }
    }
    fileViewer.appendChild(lineEl);
  });

  if (targetLineEl) {
    targetLineEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

document.getElementById('file-search').oninput = () => renderFileContent();

// Inspect helper: automatically switches tab & highlights cited text
window.inspectSource = (sourceFile, quote) => {
  let matchedFile = Object.keys(allFiles).find(f => f.endsWith(sourceFile) || sourceFile.endsWith(f));
  if (!matchedFile) {
    // If citing paper, prefer Paper Text for exact sentence highlight, or PDF
    matchedFile = sourceFile.toLowerCase().includes('paper') ? 'Paper Text' : 'README.md';
  }
  selectTab(matchedFile, quote);
};

// Item flow & rendering
const totalItems = 1 + packet.part_a.length + packet.part_b.length + 1 + 1; // Intro + A (8) + B (29) + Feedback + Export = 40
const cardMount = document.getElementById('card-mount');
const progressText = document.getElementById('progress-text');
const progressBar = document.getElementById('progress-bar-fill');

function updateProgress() {
  const current = state.stepIndex;
  const pct = Math.min(100, Math.round((current / (totalItems - 1)) * 100));
  progressBar.style.width = pct + '%';
  progressText.textContent = `Stage ${current + 1} of ${totalItems}`;
}

function renderCard() {
  cardMount.innerHTML = '';
  updateProgress();
  const idx = state.stepIndex;

  if (idx === 0) {
    renderIntroCard();
  } else if (idx <= 8) {
    const f = packet.part_a[idx - 1];
    renderPartACard(f);
    // Auto-highlight cited evidence
    if (f.agent.evidence && f.agent.evidence.length > 0) {
      inspectSource(f.agent.evidence[0].source, f.agent.evidence[0].quote);
    }
  } else if (idx <= 37) {
    const q = packet.part_b[idx - 9];
    renderPartBCard(q);
    // Auto-highlight cited evidence
    if (q.agent.evidence && q.agent.evidence.length > 0) {
      inspectSource(q.agent.evidence[0].source, q.agent.evidence[0].quote);
    }
  } else if (idx === 38) {
    renderFeedbackCard();
  } else {
    renderExportCard();
  }

  // Annotate current card for hover tooltips
  annotate(cardMount);
}

  (packet.familiarity || []).forEach(f => {

function renderPartACard(f) {

    evidenceHtml += `
      <div class="evidence-quote-box">
        <div class="evidence-meta">
          <span>${ev.source} (${ev.locator})</span>
          <button type="button" class="inspect-btn" onclick="inspectSource('${ev.source}', '${ev.quote.replace(/'/g, "\\'")}')">🔍 Inspect in Left Pane</button>
        </div>
        <div class="quote-text">"${ev.quote}"</div>

  card.innerHTML = `
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 0.78rem; font-weight: 700; color: var(--muted); text-transform: uppercase;">Part A: Benchmark Design Fact</span>
      <span class="badge stated">Fact Specification</span>

    <h2 style="margin: 6px 0 10px; font-size: 1.15rem;">${f.facet}</h2>
    
    <div class="claim-box">
      <div class="claim-header">

      </div>
      <p class="claim-reason">"${f.agent.reason}"</p>
    </div>

    <h4 style="margin: 12px 0 4px; font-size: 0.88rem;">Cited Evidence:</h4>
    ${evidenceHtml || '<p style="font-style: italic; color: var(--muted); font-size: 0.85rem;">No specific citation offered.</p>'}

    <h4 style="margin: 14px 0 4px; font-size: 0.88rem;">Your Audit Verdict:</h4>
    <div class="verdict-group">
      ${packet.verdict_options.filter(o => o.value !== 'absence_plausible').map(opt => `
        <label class="verdict-option">
          <input type="radio" name="verdict_a" value="${opt.value}" ${currentVal.verdict === opt.value ? 'checked' : ''}>
          <div>
            <div style="font-size: 0.88rem;">${opt.label}</div>

    <label style="font-size: 0.82rem; font-weight: 600; display: block; margin-top: 10px;">Auditor Notes (optional):</label>

  cardMount.appendChild(card);

function renderExportCard() {
  const card = document.createElement('div');
  card.className = 'card';
  
  const totalAudited = Object.keys(state.answers.part_a).length + Object.keys(state.answers.part_b).length;
  card.innerHTML = `
    <h2 style="margin-top:0; color: var(--primary);">Audit Completed!</h2>
    <p>You have audited <strong>${totalAudited} of 37</strong> benchmark judgments for HumanEval.</p>
    <div class="claim-box">
      <strong>Export Your Verification Findings:</strong>
      <p style="margin: 4px 0 0;">Download your completed decisions as a JSON payload or export the exact CSV formatted for the research paper (populating the missing <code>human_verdict</code> column).</p>
    </div>
    <div style="display: flex; gap: 12px; margin-top: 16px;">
      <button type="button" class="primary" onclick="exportCSV()">Export CSV for Paper</button>
      <button type="button" onclick="exportJSON()">Download JSON Payload</button>
    </div>
  `;

}

// Navigation
document.getElementById('prev-btn').onclick = () => {
  if (state.stepIndex > 0) {
    state.stepIndex--;
    renderCard();
  }
};
document.getElementById('next-btn').onclick = () => {
  if (state.stepIndex < totalItems - 1) {
    state.stepIndex++;
    renderCard();
  }
};

// Export functions
window.exportCSV = () => {
  let csv = 'benchmark,repeat,part,item_id,agent_rating,human_verdict,human_notes\n';
  packet.part_a.forEach(f => {
    const a = state.answers.part_a[f.facet] || {};
    csv += `humaneval,1,A,"${f.facet}","${f.agent.value}","${a.verdict || ''}","${(a.note || '').replace(/"/g, '""')}"\n`;
  });
  packet.part_b.forEach(q => {
    const a = state.answers.part_b[q.id] || {};
    csv += `humaneval,1,B,"${q.id}","${q.agent.answer}","${a.verdict || ''}","${(a.note || '').replace(/"/g, '""')}"\n`;
  });
  
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'humaneval-human-audit.csv';
  a.click();
};

window.exportJSON = () => {
  const payload = {
    audit_id: packet.audit_id,
    timestamp: new Date().toISOString(),
    familiarity: state.familiarity,
    answers: state.answers,
    feedback: state.feedback,
    feedback_comment: state.feedback_comment
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'humaneval-human-audit.json';
  a.click();
};

document.getElementById('export-json-btn').onclick = exportJSON;
document.getElementById('export-csv-btn').onclick = exportCSV;

// Theme toggle
const themeBtn = document.getElementById('theme-toggle');
themeBtn.onclick = () => {
  const current = document.documentElement.dataset.theme;
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
};

// Initialize
selectTab('Official PDF (Chen et al. 2021)');
renderCard();
</script>
