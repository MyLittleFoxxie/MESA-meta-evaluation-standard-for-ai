<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">
  <rect width="1800" height="1800" fill="#ffffff"/>
  <g transform="translate(0,520)">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 1. Sources -->
  <rect x="60" y="230" width="320" height="300" rx="14" fill="#f3f3f3" stroke="#555" stroke-width="3"/>
  <text x="220" y="300" text-anchor="middle" font-size="34" font-weight="bold">Fixed sources</text>
  <text x="100" y="370" font-size="28">•  3 benchmarks</text>
  <text x="100" y="420" font-size="28">•  Paper + README</text>
  <text x="100" y="470" font-size="28">•  Repository snapshot</text>

  <path d="M 380 340 L 460 250" stroke="#444" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 380 420 L 460 510" stroke="#444" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- 2. Conditions -->
  <rect x="470" y="150" width="340" height="190" rx="14" fill="#e8f1fb" stroke="#2f6db3" stroke-width="3"/>
  <text x="640" y="215" text-anchor="middle" font-size="32" font-weight="bold">Input 1</text>
  <text x="510" y="275" font-size="28">•  Paper + README</text>

  <rect x="470" y="420" width="340" height="190" rx="14" fill="#e8f1fb" stroke="#2f6db3" stroke-width="3"/>
  <text x="640" y="485" text-anchor="middle" font-size="32" font-weight="bold">Input 2</text>
  <text x="510" y="540" font-size="28">•  Paper + README</text>
  <text x="510" y="585" font-size="28">•  Repository text files</text>

  <path d="M 810 245 L 890 340" stroke="#444" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 810 515 L 890 420" stroke="#444" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- 3. Review -->
  <rect x="900" y="200" width="400" height="300" rx="14" fill="#fdf3e4" stroke="#c07a1a" stroke-width="3"/>
  <text x="1100" y="270" text-anchor="middle" font-size="34" font-weight="bold">Agent review</text>
  <text x="940" y="340" font-size="28">•  MESA rubric, 10 criteria</text>
  <text x="940" y="400" font-size="28">•  Codex, then Claude Code</text>
  <text x="940" y="460" font-size="28">•  12 sessions, 2 batches</text>

  <path d="M 1300 380 L 1380 380" stroke="#444" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- 4. Analysis -->
  <rect x="1385" y="200" width="395" height="300" rx="14" fill="#edf7ec" stroke="#3b8a3e" stroke-width="3"/>
  <text x="1582" y="270" text-anchor="middle" font-size="34" font-weight="bold">Offline analysis</text>
  <text x="1420" y="340" font-size="28">•  Citation checks</text>
  <text x="1420" y="400" font-size="28">•  Changes between inputs</text>
  <text x="1420" y="460" font-size="28">•  Agreement counts</text>
  </g>
</svg>
