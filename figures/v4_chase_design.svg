<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">
  <!-- CHASE design figure. Colours by role (Okabe-Ito based):
       inputs grey, MESA standard blue, Study 1 orange, Study 2 green.
       Stroke lightness (L*) 24 / 61 / 53 / 44 keeps the roles apart in greyscale;
       render: square canvas with viewBox "0 -520 1800 1800", qlmanage -t -s 2400,
       then sips crop to 1013 x 2400. -->

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1800" height="760" fill="#ffffff"/>

  <!-- 1 Review frameworks (input) -->
  <rect x="30" y="50" width="420" height="270" rx="14" fill="#f3f3f3" stroke="#3a3a3a" stroke-width="3"/>
  <text x="240" y="125" text-anchor="middle" font-size="34" font-weight="700">Review frameworks</text>
  <text x="65" y="200" font-size="26">•  7 existing frameworks</text>
  <text x="65" y="250" font-size="26">•  280 items transcribed</text>

  <!-- 2 Criteria mapping (MESA standard) -->
  <rect x="690" y="50" width="420" height="270" rx="14" fill="#e6f0f8" stroke="#4d9cc9" stroke-width="3"/>
  <text x="900" y="125" text-anchor="middle" font-size="34" font-weight="700">Criteria mapping</text>
  <text x="725" y="200" font-size="26">•  30 shared criteria</text>
  <text x="725" y="250" font-size="26">•  Independent mapping,</text>
  <text x="748" y="285" font-size="26">reconciled</text>

  <!-- 3 MESA rubric (Study 2) -->
  <rect x="1350" y="50" width="420" height="270" rx="14" fill="#e3f4ee" stroke="#007656" stroke-width="3"/>
  <text x="1560" y="108" text-anchor="middle" font-size="32" font-weight="700">Study 2: MESA rubric</text>
  <text x="1385" y="158" font-size="25">•  Part A: 8 description facets</text>
  <text x="1385" y="196" font-size="25">•  Part B: 29 questions</text>
  <text x="1385" y="234" font-size="25">•  Run twice per benchmark</text>
  <text x="1385" y="272" font-size="25">•  Source verification (RQ4)</text>
  <text x="1408" y="304" font-size="25">232 ratings, 64 facet values</text>

  <!-- 4 AI benchmarks (input) -->
  <rect x="30" y="440" width="420" height="260" rx="14" fill="#f3f3f3" stroke="#3a3a3a" stroke-width="3"/>
  <text x="240" y="515" text-anchor="middle" font-size="34" font-weight="700">AI benchmarks</text>
  <text x="65" y="580" font-size="26">•  4 benchmark snapshots</text>
  <text x="88" y="625" font-size="25">HumanEval, TruthfulQA,</text>
  <text x="88" y="662" font-size="25">HLE, τ-bench</text>

  <!-- 5 Benchmark reviews (Study 1) -->
  <rect x="690" y="440" width="420" height="260" rx="14" fill="#fdf0dc" stroke="#b86e00" stroke-width="3"/>
  <text x="900" y="505" text-anchor="middle" font-size="32" font-weight="700">Study 1: Reviews</text>
  <text x="725" y="565" font-size="25">•  18 coding agent sessions</text>
  <text x="725" y="605" font-size="25">•  3 published human reviews</text>
  <text x="725" y="645" font-size="25">•  Standardized onto 30 criteria</text>
  <text x="748" y="680" font-size="25">Satisfied / unsatisfied / open</text>

  <!-- 6 Comparison (Study 1) -->
  <rect x="1350" y="440" width="420" height="260" rx="14" fill="#fdf0dc" stroke="#b86e00" stroke-width="3"/>
  <text x="1560" y="505" text-anchor="middle" font-size="31" font-weight="700">Study 1: Comparison</text>
  <text x="1385" y="565" font-size="25">•  Coverage (RQ1)</text>
  <text x="1385" y="605" font-size="25">•  Pairwise agreement (RQ2)</text>
  <text x="1385" y="645" font-size="25">•  Unstated items (RQ3)</text>
  <text x="1408" y="680" font-size="25">Granularity vs. missing info</text>

  <!-- Arrows -->
  <g stroke="#444" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <!-- 1 -> 2 Review frameworks to Criteria mapping -->
    <line x1="450" y1="185" x2="686" y2="185"/>
    <!-- 2 -> 3 Criteria mapping to MESA rubric -->
    <line x1="1110" y1="185" x2="1346" y2="185"/>
    <!-- 1 -> 5 Review frameworks to Study 1 reviews -->
    <line x1="450" y1="290" x2="686" y2="470"/>
    <!-- 4 -> 5 AI benchmarks to Study 1 reviews -->
    <line x1="450" y1="570" x2="686" y2="570"/>
    <!-- 2 -> 6 Criteria mapping to Study 1 comparison -->
    <line x1="1110" y1="290" x2="1346" y2="470"/>
    <!-- 5 -> 6 Study 1 reviews to Study 1 comparison -->
    <line x1="1110" y1="570" x2="1346" y2="570"/>
  </g>
</svg>
