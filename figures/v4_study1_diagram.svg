<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">
  <rect width="1800" height="760" fill="#ffffff"/>

  <!-- 1 Review frameworks -->
  <rect x="30" y="50" width="420" height="250" rx="14" fill="#f3f3f3" stroke="#555" stroke-width="3"/>
  <text x="240" y="125" text-anchor="middle" font-size="34" font-weight="bold">Review frameworks</text>
  <text x="65" y="195" font-size="26">•  7 existing frameworks</text>
  <text x="65" y="245" font-size="26">•  280 items transcribed</text>

  <!-- 2 Criteria mapping -->
  <rect x="690" y="50" width="420" height="250" rx="14" fill="#e8f1fb" stroke="#2f6db3" stroke-width="3"/>
  <text x="900" y="125" text-anchor="middle" font-size="34" font-weight="bold">Criteria mapping</text>
  <text x="725" y="195" font-size="26">•  30 shared criteria</text>
  <text x="725" y="245" font-size="26">•  Reconciled dual-mapping</text>

  <!-- 3 Derived MESA rubric -->
  <rect x="1350" y="50" width="420" height="250" rx="14" fill="#edf7ec" stroke="#3b8a3e" stroke-width="3"/>
  <text x="1560" y="115" text-anchor="middle" font-size="32" font-weight="bold">Derived MESA rubric</text>
  <text x="1385" y="170" font-size="25">•  Part A: 8 description facets</text>
  <text x="1385" y="210" font-size="25">•  Part B: 29 evaluation items</text>
  <text x="1385" y="250" font-size="25">•  Study 2: source verification</text>
  <text x="1385" y="285" font-size="22">   296 source-verified ratings</text>

  <!-- 4 AI benchmarks -->
  <rect x="30" y="440" width="420" height="260" rx="14" fill="#e8f1fb" stroke="#2f6db3" stroke-width="3"/>
  <text x="240" y="515" text-anchor="middle" font-size="34" font-weight="bold">AI benchmarks</text>
  <text x="65" y="580" font-size="26">•  4 benchmark snapshots</text>
  <text x="65" y="630" font-size="24">   HumanEval, TruthfulQA,</text>
  <text x="65" y="668" font-size="24">   HLE, τ-bench</text>

  <!-- 5 Benchmark reviews -->
  <rect x="690" y="440" width="420" height="260" rx="14" fill="#fdf3e4" stroke="#c07a1a" stroke-width="3"/>
  <text x="900" y="505" text-anchor="middle" font-size="32" font-weight="bold">Benchmark reviews</text>
  <text x="725" y="565" font-size="25">•  18 coding agent sessions</text>
  <text x="725" y="605" font-size="25">•  3 published author reviews</text>
  <text x="725" y="645" font-size="25">•  Standardized onto 30 criteria</text>
  <text x="725" y="680" font-size="22">   Satisfied / unsatisfied / open</text>

  <!-- 6 Framework comparison (Study 1) -->
  <rect x="1350" y="440" width="420" height="260" rx="14" fill="#edf7ec" stroke="#3b8a3e" stroke-width="3"/>
  <text x="1560" y="505" text-anchor="middle" font-size="31" font-weight="bold">Study 1: Comparison</text>
  <text x="1385" y="565" font-size="25">•  Coverage (RQ1)</text>
  <text x="1385" y="605" font-size="25">•  Pairwise agreement (RQ2)</text>
  <text x="1385" y="645" font-size="25">•  Unstated items (RQ3)</text>
  <text x="1385" y="680" font-size="22">   Granularity vs. missing info</text>

  <!-- Arrows -->
  <!-- 1 -> 2 (Review frameworks to Criteria mapping) -->
  <line x1="450" y1="175" x2="675" y2="175" stroke="#444" stroke-width="4"/>
  <polygon points="670,166 688,175 670,184" fill="#444"/>

  <!-- 2 -> 3 (Criteria mapping to Derived rubric) -->
  <line x1="1110" y1="175" x2="1335" y2="175" stroke="#444" stroke-width="4"/>
  <polygon points="1330,166 1348,175 1330,184" fill="#444"/>

  <!-- 1 -> 5 (Review frameworks to Benchmark reviews) -->
  <line x1="450" y1="260" x2="672" y2="458" stroke="#444" stroke-width="4"/>
  <polygon points="668.5,466 685,470 679.1,454" fill="#444"/>

  <!-- 4 -> 5 (AI benchmarks to Benchmark reviews) -->
  <line x1="450" y1="570" x2="675" y2="570" stroke="#444" stroke-width="4"/>
  <polygon points="670,561 688,570 670,579" fill="#444"/>

  <!-- 2 -> 6 (Criteria mapping to Study 1 Comparison) -->
  <line x1="1110" y1="260" x2="1332" y2="458" stroke="#444" stroke-width="4"/>
  <polygon points="1328.5,466 1345,470 1339.1,454" fill="#444"/>

  <!-- 5 -> 6 (Benchmark reviews to Study 1 Comparison) -->
  <line x1="1110" y1="570" x2="1335" y2="570" stroke="#444" stroke-width="4"/>
  <polygon points="1330,561 1348,570 1330,579" fill="#444"/>
</svg>