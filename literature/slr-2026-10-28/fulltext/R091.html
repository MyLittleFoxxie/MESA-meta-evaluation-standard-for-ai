w-outline-none tw-group"><div class="tw-flex tw-items-center tw-justify-between"><div class="tw-w-full tw-py-2"><div class="tw-flex tw-items-center"><h3 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-base">Status:</h3><div class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-ml-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-color-gray-800">Posted</p></div></div></div><div class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-my-2 tw-flex tw-items-center tw-duration-300 tw-transform tw-bg-gray-100 group-hover:tw-bg-gray-200"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-text-gray-800 group-hover:tw-text-gray-900 tw-flex"></p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-text-gray-800 group-hover:tw-text-gray-900 tw-h-6 tw-w-6 tw-flex-shrink-0 tw-rounded-full tw-transform tw-duration-300"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-px-4 tw-border-t-2 tw-border-gray-100"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><div class="tw-py-2"><div class="tw-text-left"><h3 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-base">Version <!-- -->1</h3><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-text-gray-700">posted<!-- --> </p></div></div></div><div class="tw-pt-1"><div class="tw-pb-1"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-flex tw-justify-center tw-w-full tw-mb-2">You are reading this <!-- -->latest<!-- --> <!-- -->preprint<!-- --> version</span></p></div></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Abstract</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Assurance studies built from public software incidents depend on evidence whose fitness for reconstruction and downstream assurance analysis is rarely characterized at the level of the semantic claims the analysis consumes. We study this evidence-quality problem in a frozen 40-case frame of public tool-using-agent and Model Context Protocol incidents, separating reconstructability, replay/source resolution, oracle feasibility, pairing, releaseability, and element-level provenance of authored assurance semantics. Reproducible-vulnerability benchmarks and vulnerability-data-quality studies already establish disclosure filtering and intrinsic data-quality assessment; our contribution is narrower and task-relative. Although 39/40 cases exposed a patch or corrected state, only 20/40 met the strict paired criteria. Among 15 prefix survivors that were not strict-eligible, nonexclusive blockers were reconstruction (14), releaseability (9), replay/source resolution (4), pairing (3), and oracle feasibility (1); C38 was technically reconstructable but excluded solely by Conditional releaseability. In a ten-case deep audit, 190 representation rows were provenance-classified, and all 52 analyzer-relevant semantic attributes were source-informed rather than independent ground truth. C4 showed conclusion-relevant uncertainty: unresolved enforcement activity produced different fixed-state conclusions under fail-open versus fail-closed assignments. We additionally release AIRR-40, a 40-case, 49-field registry with a 20-case exact-upstream strict manifest and reproducibility artifacts. The study does not estimate population readiness or detector accuracy; it characterizes evidence quality for assurance-oriented benchmark construction.</p></div></span></div><div class="tw-flex tw-flex-wrap tw-pb-3"><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">software quality</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">data quality</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">software assurance</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">evidence provenance</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">incident reconstruction</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">Model Context Protocol</span></p></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Figures</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-flex tw-flex-wrap tw-items-end tw-pt-2"><button class="tw-mb-4 tw-mr-4 focus:tw-outline-none tw-group" type="button" tabindex="0"><img alt="Figure 1" loading="lazy" width="100" height="100" decoding="async" data-nimg="1" class="tw-mb-2 tw-border-2 tw-border-gray-100 tw-rounded-lg group-hover:tw-border-gray-200" style="color:transparent" srcSet="/_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-10839605%2Fv1%2F768a401a6eefcf28522bdb3a.png%3FmaxDims%3D150x150&amp;w=128&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-10839605%2Fv1%2F768a401a6eefcf28522bdb3a.png%3FmaxDims%3D150x150&amp;w=256&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-10839605%2Fv1%2F768a401a6eefcf28522bdb3a.png%3FmaxDims%3D150x150&amp;w=256&amp;q=75"/><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black group-hover:tw-underline">Figure 1</p></button></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">1. Introduction</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Assurance-oriented benchmarks built from public vulnerability advisories, repository issues, and incident reports inherit an evidence-quality problem before any analyzer is evaluated. A patch or corrected state may be visible while the affected state, deployment reconstruction, replay decision, oracle, release conditions, or assurance-relevant semantics remain incomplete or ambiguous. For tool-using agents, those missing semantics can include identity/context fields, binding relationships, transformations, and enforcement activity that determine whether a static assurance question is even well posed.</p>
<p>Prior work already establishes important neighboring facts. Vul4J filtered 912 real-world Java vulnerabilities and 1,803 fix commits through explicit source, test, reproducibility, and patch-isolation criteria to produce 79 reproducible vulnerabilities (Bui et al. 2022). Croft et al. (2023) showed that vulnerability datasets can contain substantial problems in accuracy, uniqueness, consistency, completeness, and currentness, with downstream effects. ReposVul and MegaVul further improve patch quality, repository context, code representations, and scale (Wang et al. 2024; Ni et al. 2024). We therefore do not claim novelty for filtering public vulnerabilities, for showing that a fix is insufficient for reproducibility, or for treating vulnerability-data quality as a research object.</p>
<p>The narrower gap studied here is task-relative evidence quality for software assurance over a reconstructed system representation. Even after an affected/fixed pair is available, an analyst may need to author source and consequence boundaries, required capabilities, context fields, bindings, transformations, and deployment activity that public records do not state directly. The evidentiary status of those authored semantics is distinct from ordinary source availability or label correctness, and public release may be constrained even when the technical pair is reconstructable. This study therefore combines a frame-level qualification analysis with a ten-case element-level provenance and uncertainty audit.</p>
<p>The study makes four contributions:</p>
<ol>
    <li>An empirical characterization of assurance-oriented evidence quality, including the 39/40 patch-versus-20/40 strict gap, a nonexclusive blocker decomposition, and C38, where favorable technical evidence was insufficient because Conditional releaseability alone prevented strict inclusion.</li>
    <li>An element-level provenance audit of a secondary evidence-bounded representation contract, separating analyzer-relative semantics (&Gamma;), nominal provenance (P), and unresolved alternatives (U); the study does not claim a complete/minimal &Gamma; or an ordinal evidence-strength scale.</li>
    <li>C4 as a conclusion-relevant uncertainty boundary: an unresolved enforcement-activity field yields different fixed-state conclusions under explicit fail-open versus fail-closed assignments, showing why unresolved alternatives should remain first-class rather than be forced into a negative finding.</li>
    <li>AIRR-40 (Agent Incident Reconstructability Registry), released as a reusable companion resource: a frozen 40-case, 49-field registry, a 20-case exact-upstream strict manifest, public evidence pointers, case-status metadata, release/license notes, and reproducibility artifacts.</li>
</ol></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">2. Background and Related Work</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><div id="Sec2" class="Section2"> <h2>2.1 Reproducible vulnerability benchmarks</h2> <p>Defects4J and BugSwarm demonstrate the value of frozen faulty/fixed artifacts for controlled studies (Just et al. <span citationid="CR8" class="CitationRef">2014</span>; Tomassi et al. <span citationid="CR15" class="CitationRef">2019</span>), and crash-reproduction research emphasizes explicit reproduction conditions (Soltani et al. <span citationid="CR12" class="CitationRef">2020</span>). Vul4J is the closest precedent for the qualification logic: it requires Java-source involvement, an appropriate test/PoV, publicly accessible and buildable revisions whose test status changes across the patch, and an isolated security patch (Bui et al. <span citationid="CR1" class="CitationRef">2022</span>). Starting from 912 vulnerabilities and 1,803 fix commits, it retained 79 reproducible vulnerabilities from 51 projects. Thus, large disclosure-to-benchmark attrition is prior knowledge, not a novelty claim of AIRR-40.</p> <p>ReposVul addresses tangled patches, repository-level context, and outdated patches (Wang et al. <span citationid="CR17" class="CitationRef">2024</span>), while MegaVul expands scale and code representations (Ni et al. <span citationid="CR9" class="CitationRef">2024</span>). AIRR-40 is intentionally smaller and is not a detector-training corpus; its purpose is to expose reconstructability, release constraints, and assurance-evidence status for public agent/MCP incidents.</p> </div> <div id="Sec3" class="Section2"> <h2>2.2 Vulnerability-data quality</h2> <p>Croft et al. (<span citationid="CR2" class="CitationRef">2023</span>) provide the closest vulnerability-data quality precedent. They operationalize accuracy, consistency, completeness, and currentness from the ISO/IEC 25012 data quality model and add uniqueness for vulnerability datasets. ISO/IEC 25012 defines a general model for structured-data quality and supports the specification, measurement, and evaluation of data quality under stated conditions (ISO/IEC <span citationid="CR7" class="CitationRef">2008</span>). The present constructs are not proposed as new ISO/IEC 25012 characteristics or as a validated extension of that model. Rather, reconstructability, releaseability, and element-level semantic provenance are task-relative admissibility concerns that arise when public incident records are reused to construct an assurance representation. AIRR-40 therefore complements intrinsic data-quality analysis without claiming to replace it.</p> </div> <div id="Sec4" class="Section2"> <h2>2.3 Architecture reconstruction and assurance semantics</h2> <p>Software architecture reconstruction treats higher-level system views as derived artifacts rather than direct readings of source code (Ducasse and Pollet <span citationid="CR3" class="CitationRef">2009</span>; Tamburri and Kazman <span citationid="CR14" class="CitationRef">2018</span>). Recovery approaches can differ in recovered characteristics and accuracy (Schneider et al. <span citationid="CR11" class="CitationRef">2025</span>), while model-to-analysis traceability can itself be uncertain (Trubiani et al. <span citationid="CR16" class="CitationRef">2017</span>). For agent incidents, causal understanding can require logs, documentation, system access, and tool information that public reports omit (Ezell et al. <span citationid="CR4" class="CitationRef">2025</span>). Peer-reviewed or accepted MCP studies characterize protocol threats, attack vectors, and vulnerability datasets (Hou et al. <span citationid="CR6" class="CitationRef">2026</span>; Song et al. <span citationid="CR13" class="CitationRef">2026</span>; He et al. <span citationid="CR5" class="CitationRef">2026</span>). Our contribution is upstream of detector accuracy: a reusable evidence registry and an element-level audit of the semantics used to ask an assurance question.</p> </div> <div id="Sec5" class="Section2"> <h2>2.4 Explicit novelty boundary</h2> <p> <div class="gridtable"><table float="No" id="Taba" border="1"> <colgroup cols="3"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="left" class="colspec" colname="c2" colnum="2"></div> <div align="left" class="colspec" colname="c3" colnum="3"></div> <thead> <tr> <th align="left" colname="c1"> <p>Prior work</p> </th> <th align="left" colname="c2"> <p>Established contribution</p> </th> <th align="left" colname="c3"> <p>Narrower contribution here</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p>Vul4J (2022)</p> </td> <td align="left" colname="c2"> <p>Filtering&thinsp;+&thinsp;executable reproducibility for real vulnerabilities</p> </td> <td align="left" colname="c3"> <p>Agent/MCP reconstruction, releaseability, and assurance-oriented evidence fields; AIRR-40 resource.</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Croft et al. (ICSE 2023)</p> </td> <td align="left" colname="c2"> <p>Four ISO/IEC 25012-derived data-quality characteristics plus uniqueness; vulnerability-dataset quality and downstream impact</p> </td> <td align="left" colname="c3"> <p>Task-relative reconstructability/releaseability and element-level assurance-semantic provenance/uncertainty; not a new ISO/IEC 25012 model.</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>ReposVul / MegaVul (2024)</p> </td> <td align="left" colname="c2"> <p>Higher-quality collection, repository context, representations, scale</p> </td> <td align="left" colname="c3"> <p>Small audited reconstructability registry; no training-corpus claim.</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Architecture reconstruction</p> </td> <td align="left" colname="c2"> <p>Derived system views and uncertain traceability</p> </td> <td align="left" colname="c3"> <p>Evidence status of reconstructed assurance semantics and unresolved alternatives.</p> </td> </tr> </tbody> </colgroup> </table></div> </p> </div></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">3. Study Design</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>We report an exploratory empirical reconstruction study following software-engineering case-study transparency principles (Runeson and Host 2009). The unit of analysis is an incident-derived affected/fixed case. AIRR-40 is a constructed challenge frame, not a probability sample; all rates are descriptive of this frame.</p> <p> <strong>RQ1 &mdash; Qualification and blockers</strong> <p>What evidence dimensions and blockers separate public incident disclosure from the frozen strict paired subset?</p> </p> <p> <strong>RQ2 &mdash; Residual semantic provenance</strong> <p>After source-pair acquisition in the deep subset, what provenance supports representation elements and analyzer-relevant semantic attributes?</p> </p> <p> <strong>RQ3 &mdash; Conclusion-relevant uncertainty</strong> <p>Does any explicitly unresolved representation assumption alter the static assurance conclusion under alternative admissible assignments?</p> </p> <div id="Sec7" class="Section2"> <h2>3.1 AIRR-40 and qualification protocol</h2> <p>AIRR-40 contains 49 frozen fields spanning public evidence pointers, timestamps, source stratum, affected-version knowledge, pre-fix source availability, patch/corrected-state availability, deployment reconstructability, replay-triage status, oracle feasibility, releaseability, paired-control availability, fidelity, ethics/license notes, and other descriptors. The fields are not a single scale and are not all nested gates.</p> <p>The primary status is the frozen strict definition; a pre-specified lenient definition admits configured Partial or Conditional states where allowed. In this frame, lenient eligibility coincided exactly with replay-decidability: both identified the same 31 cases. Replay triage is a decisionability screen, not a claim that an exploit was reproduced, and uses a hard 30-minute time box. Cases lacking an exact reproducibly acquirable pair are recorded as source-resolution-required rather than replay failures. Blockers are nonexclusive.</p> <p>Online Resource 1 releases AIRR-40 and the 20-case strict manifest. All 20 strict rows carry the frozen exact-upstream fidelity label. The resource preserves public pointers, case-status fields, version/mechanism notes, and release/license notes; upstream source trees are not redistributed.</p> <p>  </p> </div> <div id="Sec8" class="Section2"> <h2>3.2 Deep evidence-bounded representation audit</h2> <p>Before deep outcomes, eight strict primary cases (C2, C3, C4, C5, C8, C11, C16, C19) and two lenient-only stress cases (C1, C17) were frozen. Gate2A independently reacquired affected/fixed artifacts and used normalized fingerprints, changed production files, and fixed-only anchors. Pre-outcome corrections changed the C4 affected reference, normalized C19 extraction roots, and strengthened mechanism localization. A post-result audit later identified an inert source-diversity selector; the cohort was preserved to avoid outcome-informed reselection.</p> <p>For the deep subset we document R=(G, Γ, P, U), where G=(V,E,s,t) is the represented source-to-consequence graph and Γ=(C_req, X_req, B, T, A) contains required capability, required context, bindings, transformations, and activity. Γ is analyzer-relative; no completeness, minimality, or universality claim is made. P maps elements/attributes to nominal provenance categories, not an ordinal evidence ladder. U records unresolved propositions and alternatives.</p> <p>Online Resource 1 includes a post-result structural conformance contract and machine-readable graph schema. These check well-formedness and provenance-record presence only. Let R_Φ(E) denote the set of representations consistent with evidence E and the frozen derivation/conformance rules Φ. This study does not enumerate that set or estimate its size; RQ3 asks only whether the frozen audit contains a conclusion-relevant unresolved alternative.</p> </div> <div id="Sec9" class="Section2"> <h2>3.3 Analyzer role and claim discipline</h2> <p>A0 checks path/capability mediation; A1 additionally consumes context binding/preservation. For a common modeled path set with resolved activity, A0 Witness implies A1 Witness by construction. Thus the direction of A0/A1 disagreement is definition-constrained and the 4/8 count is not a performance result. The case-level comparison remains in Online Resource 1 only as implementation context. The main text uses analyzer output only for C4, where both analyzers agree about the effect of alternative activity assumptions.</p> </div></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">4. Results</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><div id="Sec11" class="Section2"> <h2>4.1 RQ1 &mdash; Qualification and blocker profile</h2> <p>Five of 40 AIRR-40 candidates failed the prefix evidence screen, leaving 35 survivors. Thirty-one reached a valid replay-feasibility decision. Four survivors (C27, C28, C29, C32) remained source-resolution-required and are not replay failures. Twenty cases met the strict paired definition and all 20 were exact-upstream; 31 met the lenient definition.</p> <p>Patch availability was substantially less restrictive than strict inclusion: 39/40 cases had a patch or corrected state, while 20/40 entered the strict subset. Thirty-six had a known affected version, 29 had fully available pre-fix source, 21 were fully deployment-reconstructable, 34 had a fully feasible atomic oracle, 26 were fully releasable, and 32 had paired control available. The point is not that attrition itself is novel; rather, the registry exposes assurance-specific reconstruction and release dimensions after public fixes are already visible.</p> <p> <div class="gridtable"><table float="No" id="Tabb" border="1"> <colgroup cols="3"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="char" char="." class="colspec" colname="c2" colnum="2"></div> <div align="char" char="." class="colspec" colname="c3" colnum="3"></div> <thead> <tr> <th align="left" colname="c1"> <p>Evidence dimension</p> </th> <th align="left" colname="c2"> <p>n</p> </th> <th align="left" colname="c3"> <p>% of frame</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p>Affected version known</p> </td> <td align="char" char="." colname="c2"> <p>36</p> </td> <td align="char" char="." colname="c3"> <p>90.0</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Pre-fix source fully available</p> </td> <td align="char" char="." colname="c2"> <p>29</p> </td> <td align="char" char="." colname="c3"> <p>72.5</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Patch/corrected state available</p> </td> <td align="char" char="." colname="c2"> <p>39</p> </td> <td align="char" char="." colname="c3"> <p>97.5</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Deployment fully reconstructable</p> </td> <td align="char" char="." colname="c2"> <p>21</p> </td> <td align="char" char="." colname="c3"> <p>52.5</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Valid replay decision</p> </td> <td align="char" char="." colname="c2"> <p>31</p> </td> <td align="char" char="." colname="c3"> <p>77.5</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Atomic oracle fully feasible</p> </td> <td align="char" char="." colname="c2"> <p>34</p> </td> <td align="char" char="." colname="c3"> <p>85.0</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Fully releasable</p> </td> <td align="char" char="." colname="c2"> <p>26</p> </td> <td align="char" char="." colname="c3"> <p>65.0</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Paired control available</p> </td> <td align="char" char="." colname="c2"> <p>32</p> </td> <td align="char" char="." colname="c3"> <p>80.0</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Strict exact-upstream subset</p> </td> <td align="char" char="." colname="c2"> <p>20</p> </td> <td align="char" char="." colname="c3"> <p>50.0</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Lenient eligible</p> </td> <td align="char" char="." colname="c2"> <p>31</p> </td> <td align="char" char="." colname="c3"> <p>77.5</p> </td> </tr> </tbody> </colgroup> </table></div> </p> <p>Among the 15 prefix survivors outside the strict subset, reconstruction was recorded in 14, releaseability in 9, replay/source resolution in 4, pairing in 3, and oracle feasibility in 1. Counts overlap. Eleven cases were lenient-eligible but not strict-eligible: ten were partial-upstream reconstruction cases; C38 was exact-upstream and failed strict inclusion only because releaseability was Conditional. C38 therefore separates technical reconstructability from releaseability under the study criteria.</p> <p> <div class="gridtable"><table float="No" id="Tabc" border="1"> <colgroup cols="3"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="char" char="." class="colspec" colname="c2" colnum="2"></div> <div align="char" char="." class="colspec" colname="c3" colnum="3"></div> <thead> <tr> <th align="left" colname="c1"> <p>Nonexclusive blocker</p> </th> <th align="left" colname="c2"> <p>n</p> </th> <th align="left" colname="c3"> <p>% of 15</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p>Reconstruction</p> </td> <td align="char" char="." colname="c2"> <p>14</p> </td> <td align="char" char="." colname="c3"> <p>93.3</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Releaseability</p> </td> <td align="char" char="." colname="c2"> <p>9</p> </td> <td align="char" char="." colname="c3"> <p>60.0</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Replay/source resolution</p> </td> <td align="char" char="." colname="c2"> <p>4</p> </td> <td align="char" char="." colname="c3"> <p>26.7</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Pairing</p> </td> <td align="char" char="." colname="c2"> <p>3</p> </td> <td align="char" char="." colname="c3"> <p>20.0</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Oracle</p> </td> <td align="char" char="." colname="c2"> <p>1</p> </td> <td align="char" char="." colname="c3"> <p>6.7</p> </td> </tr> </tbody> </colgroup> </table></div> </p> </div> <div id="Sec12" class="Section2"> <h2>4.2 RQ2 &mdash; Element-level provenance after source-pair acquisition</h2> <p>The ten-case post-result audit contains 190 graph/assumption rows: 12 DIRECT_ANCHOR_SUPPORTED, 20 DOCUMENTED_ABSTRACTION, 43 COARSE_FILE_LEVEL_SUPPORT, 49 INFERRED_EXPLICIT, and 66 SYNTHESIS_EXPLICIT. These are nominal categories, not five validated levels of evidence strength.</p> <p> <div class="gridtable"><table float="No" id="Tabd" border="1"> <colgroup cols="2"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="char" char="." class="colspec" colname="c2" colnum="2"></div> <thead> <tr> <th align="left" colname="c1"> <p>Nominal provenance class</p> </th> <th align="left" colname="c2"> <p>Rows</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p>DIRECT_ANCHOR_SUPPORTED</p> </td> <td align="char" char="." colname="c2"> <p>12</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>DOCUMENTED_ABSTRACTION</p> </td> <td align="char" char="." colname="c2"> <p>20</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>COARSE_FILE_LEVEL_SUPPORT</p> </td> <td align="char" char="." colname="c2"> <p>43</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>INFERRED_EXPLICIT</p> </td> <td align="char" char="." colname="c2"> <p>49</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>SYNTHESIS_EXPLICIT</p> </td> <td align="char" char="." colname="c2"> <p>66</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Total</p> </td> <td align="char" char="." colname="c2"> <p>190</p> </td> </tr> </tbody> </colgroup> </table></div> </p> <p>The audit separately records 52 analyzer-relevant semantic attributes: 20 binding, 14 capability, 14 activity, and four transformation attributes. All 52 are explicitly marked as not independent ground truth. This is not an error rate; it is the central construct-validity observation of the deep audit. Exact or partial source-pair recovery does not automatically provide independent ground truth for the semantic fields consumed by a downstream assurance abstraction.</p> <p>Every declared consequence sink in the deep representations was inferred. A direct/documented-only ablation therefore removes the source-to-consequence question in every deep state. We do not treat the all-Unmodeled output as 20 independent findings; it follows mechanically once inferred sinks are removed. The supported boundary is that source acquisition alone did not provide a direct/documented consequence boundary in this selected subset.</p> </div> <div id="Sec13" class="Section2"> <h2>4.3 RQ3 &mdash; C4 and conclusion-relevant underdetermination</h2> <p>C4 is the strongest non-tautological representation boundary. In the fixed representation an Origin-validation enforcement node is represented in code, but its deployment/activity state remains ambiguous. R0 therefore yields Witness &rarr; Unmodeled. R3_fail_open treats the ambiguous activity as inactive and yields Witness &rarr; Witness; R3_fail_closed treats it as active and yields Witness &rarr; No-Witness-under-Abstraction. A0 and A1 follow the same reversal.</p> <p> <div class="gridtable"><table float="No" id="Tabe" border="1"> <colgroup cols="3"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="left" class="colspec" colname="c2" colnum="2"></div> <div align="left" class="colspec" colname="c3" colnum="3"></div> <thead> <tr> <th align="left" colname="c1"> <p>Variant</p> </th> <th align="left" colname="c2"> <p>Activity interpretation</p> </th> <th align="left" colname="c3"> <p>A0/A1 affected &rarr; fixed</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p>R0</p> </td> <td align="left" colname="c2"> <p>unresolved</p> </td> <td align="left" colname="c3"> <p>Witness &rarr; Unmodeled</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>R3_fail_open</p> </td> <td align="left" colname="c2"> <p>ambiguous treated inactive</p> </td> <td align="left" colname="c3"> <p>Witness &rarr; Witness</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>R3_fail_closed</p> </td> <td align="left" colname="c2"> <p>ambiguous treated active</p> </td> <td align="left" colname="c3"> <p>Witness &rarr; No-Witness-under-Abstraction</p> </td> </tr> </tbody> </colgroup> </table></div> </p> <p>C4 shows that U is not merely documentation overhead: one unresolved activity proposition is conclusion-relevant under the frozen representation. It also illustrates the underdetermination captured by R_Φ(E). The study does not quantify the R-versus-system gap, estimate how often such alternatives occur, or enumerate all admissible representations.</p> </div></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">5. Discussion</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><div id="Sec15" class="Section2"> <h2>5.1 What the registry adds beyond disclosure filtering</h2> <p>Vul4J already establishes that public vulnerabilities need technical filtering and reproducibility checks. AIRR-40 should not be read as rediscovering that fact at smaller scale. Its task-specific contribution is to make reconstruction, oracle, pairing, release, and downstream semantic-evidence deficits visible for assurance-oriented agent/MCP studies. The blocker categories and row-level metadata are more transferable than the frame-specific 20/40 ratio.</p> <p>C38 makes releaseability concrete: the case is exact-upstream and favorable on the major technical evidence fields, yet Conditional releaseability keeps it outside the strict subset. This does not establish a universal benchmark rule; it shows that release can be an explicit study-quality constraint rather than a packaging footnote.</p> </div> <div id="Sec16" class="Section2"> <h2>5.2 Why P and U are separate</h2> <p>P asks what type of support is recorded for an element or semantic attribute; U asks whether unresolved alternatives remain. These questions are not equivalent. A source-informed synthesis can be explicit in P without a currently recorded alternative, while C4 shows that a directly represented enforcement node can still have an unresolved activity assignment that changes the conclusion. The distinction is operational in the released audit, but it is not a validated quality model.</p> <p>The provenance categories are intentionally non-ordinal. Direct code, documentation, coarse file support, explicit inference, and synthesis differ in kind and relevance to particular claims; the study provides no empirical basis for a universal total order or numeric score.</p> </div> <div id="Sec17" class="Section2"> <h2>5.3 Representation limits and falsifiability</h2> <p>Γ is analyzer-relative: its five semantic components were retained because A0/A1 consume them. The study does not show that they are sufficient or minimal for tool-using-agent assurance. Trust boundaries, temporal ordering, concurrency, multiplicity, or other semantics may be needed elsewhere. The representation should be revised if independent outcome-blind derivations repeatedly disagree, if direct evidence contradicts authored semantics, or if held-out cases require additional field types to pose the assurance question.</p> <p>R&thinsp;&ne;&thinsp;S remains an epistemic warning rather than a measured distance. C4 is one local probe. A stronger representation study would freeze Φ, use at least one independent derivation, report field-level disagreement, and study the size or structure of R_Φ(E). Those tests are outside the evidence of Paper A.</p> </div> <div id="Sec18" class="Section2"> <h2>5.4 Resource use</h2> <p>AIRR-40 can be reused without accepting the paper&rsquo;s strict criteria as universal. Researchers can choose alternative admissibility policies over the frozen 49 fields, compare strict/lenient or new criteria, reacquire the 20 exact-upstream strict cases through public pointers, and retain release/license notes when deciding what can be redistributed. The resource deliberately preserves excluded and unresolved cases rather than publishing only a cleaned final benchmark.</p> </div></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">6. Threats to Validity</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p> <b>Novelty and construct boundary.</b> Qualification funnels and vulnerability-data quality are established by Vul4J, Croft et al., and related dataset work. The paper claims novelty only for the narrower assurance-oriented combination of reconstructability/releaseability resource metadata and semantic provenance/uncertainty auditing. Strict, lenient, and blocker categories are study-specific operational constructs.</p> <p> <b>Selection validity.</b> AIRR-40 is a constructed challenge frame, not a probability sample. The deep cohort is not source-stratified because an intended source-diversity selector was inert; the pre-outcome cohort was preserved to avoid outcome-informed reselection.</p> <p> <b>Derivation validity.</b> The same author who studied the incident evidence authored the deep representation semantics. All 52 analyzer-relevant attributes are marked as non-independent ground truth, and no inter-derivation reliability statistic is possible. The post-result conformance contract checks structure only and does not validate the construct.</p> <p> <b>Internal validity and chronology.</b> Recovered Gate1/Gate2A/Gate2B receipts support the chronology of freezing and pre-outcome corrections and the integrity of the computational rerun. They do not independently validate source/sink or semantic choices.</p> <p> <b>External and runtime validity.</b> Deep provenance and C4 findings cannot be extrapolated to all 40 cases or unseen systems. Replay triage is a feasibility decision, not full exploit reproduction. Witness is existential under R; No-Witness-under-Abstraction is not a safety certificate, and Unmodeled is not a safe state.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">7. Reproducibility, Resource, and Data Availability</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Online Resource 1 contains AIRR-40, the frozen 40-row/49-field registry, case-status file, a 20-case exact-upstream strict-pair manifest, data dictionary/resource card, original Gate1 closeout archive, and scripts that recompute the qualification/evidence/blocker results. It also contains Gate2A correction records and the slim Gate2B post-result archive with frozen graphs, policy, analyzer code, minimal evidence freeze, outputs, and provenance audit.</p> <p>For v0.6.2, the resource validator confirms 40 rows &times; 49 fields and exact correspondence between the 20-case pair manifest and frozen strict_s8 status. The Gate1 counts recompute from row-level records; the representation validator checks structural conformance and the presence of all 52 semantic provenance rows; and the Gate2B analyzer rerun reproduces six designated outputs byte-for-byte. These establish resource consistency and computational reproducibility, not independent representation-derivation replicability.</p> <p>Full upstream source trees are not redistributed. Public pointers, version/mechanism notes, release/license notes, fingerprints, and the computational core are retained. The authored AIRR-40 registry/status metadata, data dictionary, and resource documentation in Online Resource 1 are released under the Creative Commons Attribution 4.0 International (CC BY 4.0) license. Original study/package scripts and code authored by the author are released under the MIT License. These licenses do not relicense upstream projects or third-party artifacts, which remain governed by their original terms.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">8. Conclusion</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Assurance-oriented benchmark construction is not exhausted by identifying a public vulnerability and its fix. In the constructed AIRR-40 frame, 39/40 cases exposed a patch or corrected state but only 20/40 met the frozen strict paired criteria; reconstruction and releaseability were the most frequent recorded blockers among strict-ineligible prefix survivors. The deeper evidence-quality issue appears after source acquisition: across 190 audited representation rows, all 52 analyzer-relevant semantic attributes were source-informed rather than independent ground truth. C4 shows why uncertainty must remain explicit, because one unresolved enforcement-activity assignment changes the fixed-state conclusion under opposite admissible assumptions. These findings do not define a universal software-quality metric or estimate population readiness. They identify task-relative quality conditions for assurance-oriented reuse of public incident evidence&mdash;reconstructability, releaseability, semantic provenance, and conclusion-relevant uncertainty&mdash;and release AIRR-40 and its 20-case exact-upstream strict manifest so that those conditions can be inspected, recomputed, and replaced by alternative admissibility policies.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Declarations</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p><strong>Competing interests.&nbsp;</strong>The author declares no competing interests.</p>

<p><strong>AI-assisted research disclosure.&nbsp;</strong>Generative AI tools were used during research planning, code drafting, manuscript drafting, language editing, structural consistency checking, and limited execution support. The author independently reviewed the research question, public source evidence, frozen study data, calculations, interpretations, references, and final manuscript. AI tools were not treated as independent validators and did not alter the frozen research records.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">References</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><ol><li><span>Bui, Q. C., Scandariato, R., &amp; D&iacute;az Ferreyra, N. E. (2022). Vul4J: A Dataset of Reproducible Java Vulnerabilities Geared Towards the Study of Program Repair Techniques. Proceedings of MSR, 464&ndash;468. <span class="ExternalRef"><span class="RefSource">https://doi.org/10.1145/3524842.3528482</span><span address="10.1145/3524842.3528482"
