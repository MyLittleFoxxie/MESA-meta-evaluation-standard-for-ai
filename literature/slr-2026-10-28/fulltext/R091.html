5/+8MGHGhsiHAYFiWCVCcQqBwF7UhSPglEwCkbBCAMAXPtIIT5ulQ8AAAAASUVORK5CYII=","orcid":"","institution":"","correspondingAuthor":true,"submittingAuthor":false,"prefix":"","firstName":"Byungsik","middleName":"","lastName":"Seo","suffix":""}],"badges":[],"createdAt":"2026-08-27 11:08:35","currentVersionCode":1,"declarations":"","doi":"10.21203/rs.3.rs-10839605/v1","doiUrl":"https://doi.org/10.21203/rs.3.rs-10839605/v1","draftVersion":[],"editorialEvents":[],"editorialNote":"","failedWorkflow":false,"files":[{"id":119118191,"identity":"25bcf584-08fa-49d6-b731-53dcc2c942db","added_by":"auto","created_at":"2026-09-03 09:23:14","extension":"png","order_by":1,"title":"Figure 1","display":"","copyAsset":false,"role":"figure","size":133532,"visible":true,"origin":"","legend":"\u003cp\u003eEvidence-quality structure of AIRR-40. The lenient definition coincided exactly with replay-decidability (31 cases) in this frame; strict inclusion required the additional frozen criteria. Counts describe the constructed challenge frame and are not prevalence estimates.\u003c/p\u003e","description":"","filename":"1.png","url":"https://assets-eu.researchsquare.com/files/rs-10839605/v1/768a401a6eefcf28522bdb3a.png"},{"id":122782408,"identity":"2801a027-a452-4f02-8359-6f4db7d05125","added_by":"auto","created_at":"2026-10-13 12:56:33","extension":"pdf","order_by":0,"title":"","display":"","copyAsset":false,"role":"manuscript-pdf","size":320660,"visible":true,"origin":"","legend":"","description":"","filename":"manuscript.pdf","url":"https://assets-eu.researchsquare.com/files/rs-10839605/v1/faa9ab57-0636-428d-8ee0-449b826fa84e.pdf"}],"financialInterests":"No competing interests reported.","formattedTitle":"\u003cp\u003eEvidence Quality in Assurance-Oriented Benchmark Construction\u003c/p\u003e","fulltext":[{"header":"1. Introduction","content":"\u003cp\u003eAssurance-oriented benchmarks built from public vulnerability advisories, repository issues, and incident reports inherit an evidence-quality problem before any analyzer is evaluated. A patch or corrected state may be visible while the affected state, deployment reconstruction, replay decision, oracle, release conditions, or assurance-relevant semantics remain incomplete or ambiguous. For tool-using agents, those missing semantics can include identity/context fields, binding relationships, transformations, and enforcement activity that determine whether a static assurance question is even well posed.\u003c/p\u003e\n\u003cp\u003ePrior work already establishes important neighboring facts. Vul4J filtered 912 real-world Java vulnerabilities and 1,803 fix commits through explicit source, test, reproducibility, and patch-isolation criteria to produce 79 reproducible vulnerabilities (Bui et al. 2022). Croft et al. (2023) showed that vulnerability datasets can contain substantial problems in accuracy, uniqueness, consistency, completeness, and currentness, with downstream effects. ReposVul and MegaVul further improve patch quality, repository context, code representations, and scale (Wang et al. 2024; Ni et al. 2024). We therefore do not claim novelty for filtering public vulnerabilities, for showing that a fix is insufficient for reproducibility, or for treating vulnerability-data quality as a research object.\u003c/p\u003e\n\u003cp\u003eThe narrower gap studied here is task-relative evidence quality for software assurance over a reconstructed system representation. Even after an affected/fixed pair is available, an analyst may need to author source and consequence boundaries, required capabilities, context fields, bindings, transformations, and deployment activity that public records do not state directly. The evidentiary status of those authored semantics is distinct from ordinary source availability or label correctness, and public release may be constrained even when the technical pair is reconstructable. This study therefore combines a frame-level qualification analysis with a ten-case element-level provenance and uncertainty audit.\u003c/p\u003e\n\u003cp\u003eThe study makes four contributions:\u003c/p\u003e\n\u003col\u003e\n    \u003cli\u003eAn empirical characterization of assurance-oriented evidence quality, including the 39/40 patch-versus-20/40 strict gap, a nonexclusive blocker decomposition, and C38, where favorable technical evidence was insufficient because Conditional releaseability alone prevented strict inclusion.\u003c/li\u003e\n    \u003cli\u003eAn element-level provenance audit of a secondary evidence-bounded representation contract, separating analyzer-relative semantics (\u0026Gamma;), nominal provenance (P), and unresolved alternatives (U); the study does not claim a complete/minimal \u0026Gamma; or an ordinal evidence-strength scale.\u003c/li\u003e\n    \u003cli\u003eC4 as a conclusion-relevant uncertainty boundary: an unresolved enforcement-activity field yields different fixed-state conclusions under explicit fail-open versus fail-closed assignments, showing why unresolved alternatives should remain first-class rather than be forced into a negative finding.\u003c/li\u003e\n    \u003cli\u003eAIRR-40 (Agent Incident Reconstructability Registry), released as a reusable companion resource: a frozen 40-case, 49-field registry, a 20-case exact-upstream strict manifest, public evidence pointers, case-status metadata, release/license notes, and reproducibility artifacts.\u003c/li\u003e\n\u003c/ol\u003e"},{"header":"2. Background and Related Work","content":"\u003cdiv id=\"Sec2\" class=\"Section2\"\u003e \u003ch2\u003e2.1 Reproducible vulnerability benchmarks\u003c/h2\u003e \u003cp\u003eDefects4J and BugSwarm demonstrate the value of frozen faulty/fixed artifacts for controlled studies (Just et al. \u003cspan citationid=\"CR8\" class=\"CitationRef\"\u003e2014\u003c/span\u003e; Tomassi et al. \u003cspan citationid=\"CR15\" class=\"CitationRef\"\u003e2019\u003c/span\u003e), and crash-reproduction research emphasizes explicit reproduction conditions (Soltani et al. \u003cspan citationid=\"CR12\" class=\"CitationRef\"\u003e2020\u003c/span\u003e). Vul4J is the closest precedent for the qualification logic: it requires Java-source involvement, an appropriate test/PoV, publicly accessible and buildable revisions whose test status changes across the patch, and an isolated security patch (Bui et al. \u003cspan citationid=\"CR1\" class=\"CitationRef\"\u003e2022\u003c/span\u003e). Starting from 912 vulnerabilities and 1,803 fix commits, it retained 79 reproducible vulnerabilities from 51 projects. Thus, large disclosure-to-benchmark attrition is prior knowledge, not a novelty claim of AIRR-40.\u003c/p\u003e \u003cp\u003eReposVul addresses tangled patches, repository-level context, and outdated patches (Wang et al. \u003cspan citationid=\"CR17\" class=\"CitationRef\"\u003e2024\u003c/span\u003e), while MegaVul expands scale and code representations (Ni et al. \u003cspan citationid=\"CR9\" class=\"CitationRef\"\u003e2024\u003c/span\u003e). AIRR-40 is intentionally smaller and is not a detector-training corpus; its purpose is to expose reconstructability, release constraints, and assurance-evidence status for public agent/MCP incidents.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec3\" class=\"Section2\"\u003e \u003ch2\u003e2.2 Vulnerability-data quality\u003c/h2\u003e \u003cp\u003eCroft et al. (\u003cspan citationid=\"CR2\" class=\"CitationRef\"\u003e2023\u003c/span\u003e) provide the closest vulnerability-data quality precedent. They operationalize accuracy, consistency, completeness, and currentness from the ISO/IEC 25012 data quality model and add uniqueness for vulnerability datasets. ISO/IEC 25012 defines a general model for structured-data quality and supports the specification, measurement, and evaluation of data quality under stated conditions (ISO/IEC \u003cspan citationid=\"CR7\" class=\"CitationRef\"\u003e2008\u003c/span\u003e). The present constructs are not proposed as new ISO/IEC 25012 characteristics or as a validated extension of that model. Rather, reconstructability, releaseability, and element-level semantic provenance are task-relative admissibility concerns that arise when public incident records are reused to construct an assurance representation. AIRR-40 therefore complements intrinsic data-quality analysis without claiming to replace it.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec4\" class=\"Section2\"\u003e \u003ch2\u003e2.3 Architecture reconstruction and assurance semantics\u003c/h2\u003e \u003cp\u003eSoftware architecture reconstruction treats higher-level system views as derived artifacts rather than direct readings of source code (Ducasse and Pollet \u003cspan citationid=\"CR3\" class=\"CitationRef\"\u003e2009\u003c/span\u003e; Tamburri and Kazman \u003cspan citationid=\"CR14\" class=\"CitationRef\"\u003e2018\u003c/span\u003e). Recovery approaches can differ in recovered characteristics and accuracy (Schneider et al. \u003cspan citationid=\"CR11\" class=\"CitationRef\"\u003e2025\u003c/span\u003e), while model-to-analysis traceability can itself be uncertain (Trubiani et al. \u003cspan citationid=\"CR16\" class=\"CitationRef\"\u003e2017\u003c/span\u003e). For agent incidents, causal understanding can require logs, documentation, system access, and tool information that public reports omit (Ezell et al. \u003cspan citationid=\"CR4\" class=\"CitationRef\"\u003e2025\u003c/span\u003e). Peer-reviewed or accepted MCP studies characterize protocol threats, attack vectors, and vulnerability datasets (Hou et al. \u003cspan citationid=\"CR6\" class=\"CitationRef\"\u003e2026\u003c/span\u003e; Song et al. \u003cspan citationid=\"CR13\" class=\"CitationRef\"\u003e2026\u003c/span\u003e; He et al. \u003cspan citationid=\"CR5\" class=\"CitationRef\"\u003e2026\u003c/span\u003e). Our contribution is upstream of detector accuracy: a reusable evidence registry and an element-level audit of the semantics used to ask an assurance question.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec5\" class=\"Section2\"\u003e \u003ch2\u003e2.4 Explicit novelty boundary\u003c/h2\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"No\" id=\"Taba\" border=\"1\"\u003e \u003ccolgroup cols=\"3\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c3\" colnum=\"3\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\"\u003e \u003cp\u003ePrior work\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003eEstablished contribution\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c3\"\u003e \u003cp\u003eNarrower contribution here\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003c/thead\u003e \u003ctbody\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eVul4J (2022)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eFiltering\u0026thinsp;+\u0026thinsp;executable reproducibility for real vulnerabilities\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eAgent/MCP reconstruction, releaseability, and assurance-oriented evidence fields; AIRR-40 resource.\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eCroft et al. (ICSE 2023)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eFour ISO/IEC 25012-derived data-quality characteristics plus uniqueness; vulnerability-dataset quality and downstream impact\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eTask-relative reconstructability/releaseability and element-level assurance-semantic provenance/uncertainty; not a new ISO/IEC 25012 model.\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eReposVul / MegaVul (2024)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eHigher-quality collection, repository context, representations, scale\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eSmall audited reconstructability registry; no training-corpus claim.\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eArchitecture reconstruction\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eDerived system views and uncertain traceability\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eEvidence status of reconstructed assurance semantics and unresolved alternatives.\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003c/div\u003e"},{"header":"3. Study Design","content":"\u003cp\u003eWe report an exploratory empirical reconstruction study following software-engineering case-study transparency principles (Runeson and Host 2009). The unit of analysis is an incident-derived affected/fixed case. AIRR-40 is a constructed challenge frame, not a probability sample; all rates are descriptive of this frame.\u003c/p\u003e \u003cp\u003e \u003cstrong\u003eRQ1 \u0026mdash; Qualification and blockers\u003c/strong\u003e \u003cp\u003eWhat evidence dimensions and blockers separate public incident disclosure from the frozen strict paired subset?\u003c/p\u003e \u003c/p\u003e \u003cp\u003e \u003cstrong\u003eRQ2 \u0026mdash; Residual semantic provenance\u003c/strong\u003e \u003cp\u003eAfter source-pair acquisition in the deep subset, what provenance supports representation elements and analyzer-relevant semantic attributes?\u003c/p\u003e \u003c/p\u003e \u003cp\u003e \u003cstrong\u003eRQ3 \u0026mdash; Conclusion-relevant uncertainty\u003c/strong\u003e \u003cp\u003eDoes any explicitly unresolved representation assumption alter the static assurance conclusion under alternative admissible assignments?\u003c/p\u003e \u003c/p\u003e \u003cdiv id=\"Sec7\" class=\"Section2\"\u003e \u003ch2\u003e3.1 AIRR-40 and qualification protocol\u003c/h2\u003e \u003cp\u003eAIRR-40 contains 49 frozen fields spanning public evidence pointers, timestamps, source stratum, affected-version knowledge, pre-fix source availability, patch/corrected-state availability, deployment reconstructability, replay-triage status, oracle feasibility, releaseability, paired-control availability, fidelity, ethics/license notes, and other descriptors. The fields are not a single scale and are not all nested gates.\u003c/p\u003e \u003cp\u003eThe primary status is the frozen strict definition; a pre-specified lenient definition admits configured Partial or Conditional states where allowed. In this frame, lenient eligibility coincided exactly with replay-decidability: both identified the same 31 cases. Replay triage is a decisionability screen, not a claim that an exploit was reproduced, and uses a hard 30-minute time box. Cases lacking an exact reproducibly acquirable pair are recorded as source-resolution-required rather than replay failures. Blockers are nonexclusive.\u003c/p\u003e \u003cp\u003eOnline Resource 1 releases AIRR-40 and the 20-case strict manifest. All 20 strict rows carry the frozen exact-upstream fidelity label. The resource preserves public pointers, case-status fields, version/mechanism notes, and release/license notes; upstream source trees are not redistributed.\u003c/p\u003e \u003cp\u003e  \u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec8\" class=\"Section2\"\u003e \u003ch2\u003e3.2 Deep evidence-bounded representation audit\u003c/h2\u003e \u003cp\u003eBefore deep outcomes, eight strict primary cases (C2, C3, C4, C5, C8, C11, C16, C19) and two lenient-only stress cases (C1, C17) were frozen. Gate2A independently reacquired affected/fixed artifacts and used normalized fingerprints, changed production files, and fixed-only anchors. Pre-outcome corrections changed the C4 affected reference, normalized C19 extraction roots, and strengthened mechanism localization. A post-result audit later identified an inert source-diversity selector; the cohort was preserved to avoid outcome-informed reselection.\u003c/p\u003e \u003cp\u003eFor the deep subset we document R=(G, Γ, P, U), where G=(V,E,s,t) is the represented source-to-consequence graph and Γ=(C_req, X_req, B, T, A) contains required capability, required context, bindings, transformations, and activity. Γ is analyzer-relative; no completeness, minimality, or universality claim is made. P maps elements/attributes to nominal provenance categories, not an ordinal evidence ladder. U records unresolved propositions and alternatives.\u003c/p\u003e \u003cp\u003eOnline Resource 1 includes a post-result structural conformance contract and machine-readable graph schema. These check well-formedness and provenance-record presence only. Let R_Φ(E) denote the set of representations consistent with evidence E and the frozen derivation/conformance rules Φ. This study does not enumerate that set or estimate its size; RQ3 asks only whether the frozen audit contains a conclusion-relevant unresolved alternative.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec9\" class=\"Section2\"\u003e \u003ch2\u003e3.3 Analyzer role and claim discipline\u003c/h2\u003e \u003cp\u003eA0 checks path/capability mediation; A1 additionally consumes context binding/preservation. For a common modeled path set with resolved activity, A0 Witness implies A1 Witness by construction. Thus the direction of A0/A1 disagreement is definition-constrained and the 4/8 count is not a performance result. The case-level comparison remains in Online Resource 1 only as implementation context. The main text uses analyzer output only for C4, where both analyzers agree about the effect of alternative activity assumptions.\u003c/p\u003e \u003c/div\u003e"},{"header":"4. Results","content":"\u003cdiv id=\"Sec11\" class=\"Section2\"\u003e \u003ch2\u003e4.1 RQ1 \u0026mdash; Qualification and blocker profile\u003c/h2\u003e \u003cp\u003eFive of 40 AIRR-40 candidates failed the prefix evidence screen, leaving 35 survivors. Thirty-one reached a valid replay-feasibility decision. Four survivors (C27, C28, C29, C32) remained source-resolution-required and are not replay failures. Twenty cases met the strict paired definition and all 20 were exact-upstream; 31 met the lenient definition.\u003c/p\u003e \u003cp\u003ePatch availability was substantially less restrictive than strict inclusion: 39/40 cases had a patch or corrected state, while 20/40 entered the strict subset. Thirty-six had a known affected version, 29 had fully available pre-fix source, 21 were fully deployment-reconstructable, 34 had a fully feasible atomic oracle, 26 were fully releasable, and 32 had paired control available. The point is not that attrition itself is novel; rather, the registry exposes assurance-specific reconstruction and release dimensions after public fixes are already visible.\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"No\" id=\"Tabb\" border=\"1\"\u003e \u003ccolgroup cols=\"3\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c3\" colnum=\"3\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\"\u003e \u003cp\u003eEvidence dimension\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003en\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c3\"\u003e \u003cp\u003e% of frame\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003c/thead\u003e \u003ctbody\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eAffected version known\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e36\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e90.0\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003ePre-fix source fully available\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e29\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e72.5\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003ePatch/corrected state available\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e39\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e97.5\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eDeployment fully reconstructable\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e21\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e52.5\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eValid replay decision\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e31\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e77.5\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eAtomic oracle fully feasible\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e34\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e85.0\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eFully releasable\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e26\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e65.0\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003ePaired control available\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e32\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e80.0\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eStrict exact-upstream subset\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e20\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e50.0\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eLenient eligible\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e31\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e77.5\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003cp\u003eAmong the 15 prefix survivors outside the strict subset, reconstruction was recorded in 14, releaseability in 9, replay/source resolution in 4, pairing in 3, and oracle feasibility in 1. Counts overlap. Eleven cases were lenient-eligible but not strict-eligible: ten were partial-upstream reconstruction cases; C38 was exact-upstream and failed strict inclusion only because releaseability was Conditional. C38 therefore separates technical reconstructability from releaseability under the study criteria.\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"No\" id=\"Tabc\" border=\"1\"\u003e \u003ccolgroup cols=\"3\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c3\" colnum=\"3\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\"\u003e \u003cp\u003eNonexclusive blocker\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003en\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c3\"\u003e \u003cp\u003e% of 15\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003c/thead\u003e \u003ctbody\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eReconstruction\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e14\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e93.3\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eReleaseability\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e9\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e60.0\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eReplay/source resolution\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e4\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e26.7\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003ePairing\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e3\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e20.0\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eOracle\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e1\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c3\"\u003e \u003cp\u003e6.7\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec12\" class=\"Section2\"\u003e \u003ch2\u003e4.2 RQ2 \u0026mdash; Element-level provenance after source-pair acquisition\u003c/h2\u003e \u003cp\u003eThe ten-case post-result audit contains 190 graph/assumption rows: 12 DIRECT_ANCHOR_SUPPORTED, 20 DOCUMENTED_ABSTRACTION, 43 COARSE_FILE_LEVEL_SUPPORT, 49 INFERRED_EXPLICIT, and 66 SYNTHESIS_EXPLICIT. These are nominal categories, not five validated levels of evidence strength.\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"No\" id=\"Tabd\" border=\"1\"\u003e \u003ccolgroup cols=\"2\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"char\" char=\".\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\"\u003e \u003cp\u003eNominal provenance class\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003eRows\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003c/thead\u003e \u003ctbody\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eDIRECT_ANCHOR_SUPPORTED\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e12\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eDOCUMENTED_ABSTRACTION\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e20\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eCOARSE_FILE_LEVEL_SUPPORT\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e43\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eINFERRED_EXPLICIT\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e49\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eSYNTHESIS_EXPLICIT\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e66\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eTotal\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"char\" char=\".\" colname=\"c2\"\u003e \u003cp\u003e190\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003cp\u003eThe audit separately records 52 analyzer-relevant semantic attributes: 20 binding, 14 capability, 14 activity, and four transformation attributes. All 52 are explicitly marked as not independent ground truth. This is not an error rate; it is the central construct-validity observation of the deep audit. Exact or partial source-pair recovery does not automatically provide independent ground truth for the semantic fields consumed by a downstream assurance abstraction.\u003c/p\u003e \u003cp\u003eEvery declared consequence sink in the deep representations was inferred. A direct/documented-only ablation therefore removes the source-to-consequence question in every deep state. We do not treat the all-Unmodeled output as 20 independent findings; it follows mechanically once inferred sinks are removed. The supported boundary is that source acquisition alone did not provide a direct/documented consequence boundary in this selected subset.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec13\" class=\"Section2\"\u003e \u003ch2\u003e4.3 RQ3 \u0026mdash; C4 and conclusion-relevant underdetermination\u003c/h2\u003e \u003cp\u003eC4 is the strongest non-tautological representation boundary. In the fixed representation an Origin-validation enforcement node is represented in code, but its deployment/activity state remains ambiguous. R0 therefore yields Witness \u0026rarr; Unmodeled. R3_fail_open treats the ambiguous activity as inactive and yields Witness \u0026rarr; Witness; R3_fail_closed treats it as active and yields Witness \u0026rarr; No-Witness-under-Abstraction. A0 and A1 follow the same reversal.\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"No\" id=\"Tabe\" border=\"1\"\u003e \u003ccolgroup cols=\"3\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c3\" colnum=\"3\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\"\u003e \u003cp\u003eVariant\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003eActivity interpretation\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c3\"\u003e \u003cp\u003eA0/A1 affected \u0026rarr; fixed\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003c/thead\u003e \u003ctbody\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eR0\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eunresolved\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eWitness \u0026rarr; Unmodeled\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eR3_fail_open\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eambiguous treated inactive\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eWitness \u0026rarr; Witness\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eR3_fail_closed\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eambiguous treated active\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eWitness \u0026rarr; No-Witness-under-Abstraction\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003cp\u003eC4 shows that U is not merely documentation overhead: one unresolved activity proposition is conclusion-relevant under the frozen representation. It also illustrates the underdetermination captured by R_Φ(E). The study does not quantify the R-versus-system gap, estimate how often such alternatives occur, or enumerate all admissible representations.\u003c/p\u003e \u003c/div\u003e"},{"header":"5. Discussion","content":"\u003cdiv id=\"Sec15\" class=\"Section2\"\u003e \u003ch2\u003e5.1 What the registry adds beyond disclosure filtering\u003c/h2\u003e \u003cp\u003eVul4J already establishes that public vulnerabilities need technical filtering and reproducibility checks. AIRR-40 should not be read as rediscovering that fact at smaller scale. Its task-specific contribution is to make reconstruction, oracle, pairing, release, and downstream semantic-evidence deficits visible for assurance-oriented agent/MCP studies. The blocker categories and row-level metadata are more transferable than the frame-specific 20/40 ratio.\u003c/p\u003e \u003cp\u003eC38 makes releaseability concrete: the case is exact-upstream and favorable on the major technical evidence fields, yet Conditional releaseability keeps it outside the strict subset. This does not establish a universal benchmark rule; it shows that release can be an explicit study-quality constraint rather than a packaging footnote.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec16\" class=\"Section2\"\u003e \u003ch2\u003e5.2 Why P and U are separate\u003c/h2\u003e \u003cp\u003eP asks what type of support is recorded for an element or semantic attribute; U asks whether unresolved alternatives remain. These questions are not equivalent. A source-informed synthesis can be explicit in P without a currently recorded alternative, while C4 shows that a directly represented enforcement node can still have an unresolved activity assignment that changes the conclusion. The distinction is operational in the released audit, but it is not a validated quality model.\u003c/p\u003e \u003cp\u003eThe provenance categories are intentionally non-ordinal. Direct code, documentation, coarse file support, explicit inference, and synthesis differ in kind and relevance to particular claims; the study provides no empirical basis for a universal total order or numeric score.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec17\" class=\"Section2\"\u003e \u003ch2\u003e5.3 Representation limits and falsifiability\u003c/h2\u003e \u003cp\u003eΓ is analyzer-relative: its five semantic components were retained because A0/A1 consume them. The study does not show that they are sufficient or minimal for tool-using-agent assurance. Trust boundaries, temporal ordering, concurrency, multiplicity, or other semantics may be needed elsewhere. The representation should be revised if independent outcome-blind derivations repeatedly disagree, if direct evidence contradicts authored semantics, or if held-out cases require additional field types to pose the assurance question.\u003c/p\u003e \u003cp\u003eR\u0026thinsp;\u0026ne;\u0026thinsp;S remains an epistemic warning rather than a measured distance. C4 is one local probe. A stronger representation study would freeze Φ, use at least one independent derivation, report field-level disagreement, and study the size or structure of R_Φ(E). Those tests are outside the evidence of Paper A.\u003c/p\u003e \u003c/div\u003e \u003cdiv id=\"Sec18\" class=\"Section2\"\u003e \u003ch2\u003e5.4 Resource use\u003c/h2\u003e \u003cp\u003eAIRR-40 can be reused without accepting the paper\u0026rsquo;s strict criteria as universal. Researchers can choose alternative admissibility policies over the frozen 49 fields, compare strict/lenient or new criteria, reacquire the 20 exact-upstream strict cases through public pointers, and retain release/license notes when deciding what can be redistributed. The resource deliberately preserves excluded and unresolved cases rather than publishing only a cleaned final benchmark.\u003c/p\u003e \u003c/div\u003e"},{"header":"6. Threats to Validity","content":"\u003cp\u003e \u003cb\u003eNovelty and construct boundary.\u003c/b\u003e Qualification funnels and vulnerability-data quality are established by Vul4J, Croft et al., and related dataset work. The paper claims novelty only for the narrower assurance-oriented combination of reconstructability/releaseability resource metadata and semantic provenance/uncertainty auditing. Strict, lenient, and blocker categories are study-specific operational constructs.\u003c/p\u003e \u003cp\u003e \u003cb\u003eSelection validity.\u003c/b\u003e AIRR-40 is a constructed challenge frame, not a probability sample. The deep cohort is not source-stratified because an intended source-diversity selector was inert; the pre-outcome cohort was preserved to avoid outcome-informed reselection.\u003c/p\u003e \u003cp\u003e \u003cb\u003eDerivation validity.\u003c/b\u003e The same author who studied the incident evidence authored the deep representation semantics. All 52 analyzer-relevant attributes are marked as non-independent ground truth, and no inter-derivation reliability statistic is possible. The post-result conformance contract checks structure only and does not validate the construct.\u003c/p\u003e \u003cp\u003e \u003cb\u003eInternal validity and chronology.\u003c/b\u003e Recovered Gate1/Gate2A/Gate2B receipts support the chronology of freezing and pre-outcome corrections and the integrity of the computational rerun. They do not independently validate source/sink or semantic choices.\u003c/p\u003e \u003cp\u003e \u003cb\u003eExternal and runtime validity.\u003c/b\u003e Deep provenance and C4 findings cannot be extrapolated to all 40 cases or unseen systems. Replay triage is a feasibility decision, not full exploit reproduction. Witness is existential under R; No-Witness-under-Abstraction is not a safety certificate, and Unmodeled is not a safe state.\u003c/p\u003e"},{"header":"7. Reproducibility, Resource, and Data Availability","content":"\u003cp\u003eOnline Resource 1 contains AIRR-40, the frozen 40-row/49-field registry, case-status file, a 20-case exact-upstream strict-pair manifest, data dictionary/resource card, original Gate1 closeout archive, and scripts that recompute the qualification/evidence/blocker results. It also contains Gate2A correction records and the slim Gate2B post-result archive with frozen graphs, policy, analyzer code, minimal evidence freeze, outputs, and provenance audit.\u003c/p\u003e \u003cp\u003eFor v0.6.2, the resource validator confirms 40 rows \u0026times; 49 fields and exact correspondence between the 20-case pair manifest and frozen strict_s8 status. The Gate1 counts recompute from row-level records; the representation validator checks structural conformance and the presence of all 52 semantic provenance rows; and the Gate2B analyzer rerun reproduces six designated outputs byte-for-byte. These establish resource consistency and computational reproducibility, not independent representation-derivation replicability.\u003c/p\u003e \u003cp\u003eFull upstream source trees are not redistributed. Public pointers, version/mechanism notes, release/license notes, fingerprints, and the computational core are retained. The authored AIRR-40 registry/status metadata, data dictionary, and resource documentation in Online Resource 1 are released under the Creative Commons Attribution 4.0 International (CC BY 4.0) license. Original study/package scripts and code authored by the author are released under the MIT License. These licenses do not relicense upstream projects or third-party artifacts, which remain governed by their original terms.\u003c/p\u003e"},{"header":"8. Conclusion","content":"\u003cp\u003eAssurance-oriented benchmark construction is not exhausted by identifying a public vulnerability and its fix. In the constructed AIRR-40 frame, 39/40 cases exposed a patch or corrected state but only 20/40 met the frozen strict paired criteria; reconstruction and releaseability were the most frequent recorded blockers among strict-ineligible prefix survivors. The deeper evidence-quality issue appears after source acquisition: across 190 audited representation rows, all 52 analyzer-relevant semantic attributes were source-informed rather than independent ground truth. C4 shows why uncertainty must remain explicit, because one unresolved enforcement-activity assignment changes the fixed-state conclusion under opposite admissible assumptions. These findings do not define a universal software-quality metric or estimate population readiness. They identify task-relative quality conditions for assurance-oriented reuse of public incident evidence\u0026mdash;reconstructability, releaseability, semantic provenance, and conclusion-relevant uncertainty\u0026mdash;and release AIRR-40 and its 20-case exact-upstream strict manifest so that those conditions can be inspected, recomputed, and replaced by alternative admissibility policies.\u003c/p\u003e"},{"header":"Declarations","content":"\u003cp\u003e\u003cstrong\u003eCompeting interests.\u0026nbsp;\u003c/strong\u003eThe author declares no competing interests.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eFunding.\u0026nbsp;\u003c/strong\u003eNo specific external funding was received for this work.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eData availability.\u0026nbsp;\u003c/strong\u003eAIRR-40 and the accompanying reproducibility/evidence package are provided as Online Resource 1. The authored AIRR-40 registry/status metadata and documentation are licensed under CC BY 4.0, and original study/package scripts and code authored by the author are licensed under the MIT License. Full upstream source trees are not redistributed and remain governed by their original licenses; public source pointers, versions, fingerprints, frozen status records, and the computational core used for the reported recomputations are included.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEthics approval.\u0026nbsp;\u003c/strong\u003eNot applicable. The study analyzes public software-security records and software artifacts and does not involve human participants or private personal data.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eConsent to participate.\u0026nbsp;\u003c/strong\u003eNot applicable.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eConsent for publication.\u0026nbsp;\u003c/strong\u003eNot applicable.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAuthor contributions.\u0026nbsp;\u003c/strong\u003eThe author conceived the study, designed the methodology, conducted and reviewed the analysis, curated the study records, interpreted the results, and prepared the manuscript.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAI-assisted research disclosure.\u0026nbsp;\u003c/strong\u003eGenerative AI tools were used during research planning, code drafting, manuscript drafting, language editing, structural consistency checking, and limited execution support. The author independently reviewed the research question, public source evidence, frozen study data, calculations, interpretations, references, and final manuscript. AI tools were not treated as independent validators and did not alter the frozen research records.\u003c/p\u003e"},{"header":"References","content":"\u003col\u003e\u003cli\u003e\u003cspan\u003eBui, Q. C., Scandariato, R., \u0026amp; D\u0026iacute;az Ferreyra, N. E. (2022). Vul4J: A Dataset of Reproducible Java Vulnerabilities Geared Towards the Study of Program Repair Techniques. Proceedings of MSR, 464\u0026ndash;468. \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003ehttps://doi.org/10.1145/3524842.3528482\u003c/span\u003e\u003cspan address=\"10.1145/3524842.3528482\" targettype=\"DOI\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eCroft, R., Babar, M. A., \u0026amp; Kholoosi, M. M. (2023). Data Quality for Software Vulnerability Datasets. ICSE 2023, 121\u0026ndash;133. \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003ehttps://doi.org/10.1109/ICSE48619.2023.00022\u003c/span\u003e\u003cspan address=\"10.1109/ICSE48619.2023.00022\" targettype=\"DOI\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eDucasse, S., \u0026amp; Pollet, D. (2009). Software Architecture Reconstruction: A Process-Oriented Taxonomy. \u003cem\u003eIEEE TSE\u003c/em\u003e, \u003cem\u003e35\u003c/em\u003e(4), 573\u0026ndash;591. \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003ehttps://doi.org/10.1109/TSE.2009.19\u003c/span\u003e\u003cspan address=\"10.1109/TSE.2009.19\" targettype=\"DOI\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eEzell, C., Roberts-Gaal, X., \u0026amp; Chan, A. (2025). Inc n\u003e\u003c/span\u003e\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eTrubiani, C., Ghabi, A., \u0026amp; Egyed, A. (2017). Exploiting traceability uncertainty between software architectural models and extra-functional results. \u003cem\u003eJSS\u003c/em\u003e, \u003cem\u003e125\u003c/em\u003e, 15\u0026ndash;34. \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003ehttps://doi.org/10.1016/j.jss.2016.11.032\u003c/span\u003e\u003cspan address=\"10.1016/j.jss.2016.11.032\" targettype=\"DOI\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eWang, X., Hu, R., Gao, C., Wen, X. C., Chen, Y., \u0026amp; Liao, Q. (2024). ReposVul: A Repository-Level High-Quality Vulnerability Dataset. \u003cem\u003eICSE Companion\u003c/em\u003e, 472\u0026ndash;483. \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003ehttps://doi.org/10.1145/3639478.3647634\u003c/span\u003e\u003cspan address=\"10.1145/3639478.3647634\" targettype=\"DOI\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e.\u003c/span\u003e\u003c/li\u003e\u003c/ol\u003e"}],"fulltextSource":"","fullText":"","funders":[],"hasAdminPriorityOnWorkflow":false,"hasManuscriptDocX":true,"hasOptedInToPreprint":true,"hasPassedJournalQc":"","hasAnyPriority":true,"hideJournal":true,"highlight":"","institution":"","isAcceptedByJournal":false,"isAuthorSuppliedPdf":false,"isDeskRejected":"","isHiddenFromSearch":false,"isInQc":false,"isInWorkflow":false,"isPdf":false,"isPdfUpToDate":true,"isWithdrawnOrRetracted":false,"journal":{"display":true,"email":"info@researchsquare.com","identity":"researchsquare","isNatureJournal":false,"hasQc":true,"allowDirectSubmit":true,"externalIdentity":"","sideBox":"","snPcode":"","submissionUrl":"/submission","title":"Research Square","twitterHandle":"researchsquare","acdcEnabled":true,"dfaEnabled":false,"editorialSystem":"","reportingPortfolio":"","inReviewEnabled":false,"inReviewRevisionsEnabled":true},"keywords":"software quality, data quality, software assurance, evidence provenance, incident reconstruction, Model Context Protocol","lastPublishedDoi":"10.21203/rs.3.rs-10839605/v1","lastPublishedDoiUrl":"https://doi.org/10.21203/rs.3.rs-10839605/v1","license":{"name":"CC BY 4.0","url":"https://creativecommons.org/licenses/by/4.0/"},"manuscriptAbstract":"\u003cp\u003eAssurance studies built from public software incidents depend on evidence whose fitness for reconstruction and downstream assurance analysis is rarely characterized at the level of the semantic claims the analysis consumes. We study this evidence-quality problem in a frozen 40-case frame of public tool-using-agent and Model Context Protocol incidents, separating reconstructability, replay/source resolution, oracle feasibility, pairing, releaseability, and element-level provenance of authored assurance semantics. Reproducible-vulnerability benchmarks and vulnerability-data-quality studies already establish disclosure filtering and intrinsic data-quality assessment; our contribution is narrower and task-relative. Although 39/40 cases exposed a patch or corrected state, only 20/40 met the strict paired criteria. Among 15 prefix survivors that were not strict-eligible, nonexclusive blockers were reconstruction (14), releaseability (9), replay/source resolution (4), pairing (3), and oracle feasibility (1); C38 was technically reconstructable but excluded solely by Conditional releaseability. In a ten-case deep audit, 190 representation rows were provenance-classified, and all 52 analyzer-relevant semantic attributes were source-informed rather than independent ground truth. C4 showed conclusion-relevant uncertainty: unresolved enforcement activity produced different fixed-state conclusions under fail-open versus fail-closed assignments. We additionally release AIRR-40, a 40-case, 49-field registry with a 20-case exact-upstream strict manifest and reproducibility artifacts. The study does not estimate population readiness or detector accuracy; it characterizes evidence quality for assurance-oriented benchmark construction.\u003c/p\u003e","manuscriptTitle":"Evidence Quality in Assurance-Oriented Benchmark Construction","msid":"","msnumber":"","nonDraftVersions":[{"code":1,"date":"2026-09-03 09:23:04","doi":"10.21203/rs.3.rs-10839605/v1","editorialEvents":[{"type":"communityComments","content":0}],"status":"published","journal":{"display":true,"email":"info@researchsquare.com","identity":"researchsquare","isNatureJournal":false,"hasQc":true,"allowDirectSubmit":true,"externalIdentity":"","sideBox":"","snPcode":"","submissionUrl":"/submission","title":"Research Square","twitterHandle":"researchsquare","acdcEnabled":true,"dfaEnabled":false,"editorialSystem":"","reportingPortfolio":"","inReviewEnabled":false,"inReviewRevisionsEnabled":true}}],"origin":"","ownerIdentity":"565eff21-aee8-4a9d-8e8f-983a545be886","owner":[],"postedDate":"September 3rd, 2026","published":true,"recentEditorialEvents":[{"type":"decision","content":"Rejected","date":"2026-10-13T12:47:01+00:00","index":"","fulltext":""}],"rejectedJournal":[],"revision":"","amendment":"","status":"posted","subjectAreas":[],"tags":[],"updatedAt":"2026-10-13T12:54:41+00:00","versionOfRecord":[],"versionCreatedAt":"2026-09-03 09:23:04","video":"","vorDoi":"","vorDoiUrl":"","workflowStages":[]},"version":"v1","identity":"rs-10839605","journalConfig":"researchsquare"},"__N_SSP":true},"page":"/article/[identity]/[[...version]]","query":{"identity":"rs-10839605","version":["v1"]},"buildId":"_rKDHFSCF-2tw6eG1fWyD","isFallback":false,"isExperimentalCompile":false,"dynamicIds":[84888],"gssp":true,"scriptLoader":[]}</script><div hidden="" id="snipcart" data-api-key="ODA3NTlmNDUtYjRjNy00MzE2LTgzNmYtYjUwY2Y4MWFkOWRlNjM3MTQwMjI1MDM0NDU2MjEx"></div><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092" integrity="sha512-UKNk8GbxkAB
