tw-w-full tw-mb-2">You are reading this <!-- -->latest<!-- --> <!-- -->preprint<!-- --> version</span></p></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Abstract</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Large Language Models (LLMs) are increasingly applied to emotion classification, yet Arabic benchmarks remain limited and oftenfocus solely on predictive performance. This work introduces a reliability-aware perspective through an abstention-aware benchmarkfor Arabic emotion classification. The benchmark is based on 1002 manually annotated sentences across five emotion categories,with very high inter-annotator agreement (κ = 0.9722). Our framework evaluates multiple LLMs under a unified zero-shot settingand explicitly models reliability through coverage, unknown-rate, and strict versus covered evaluation protocols. We further include acontrolled few-shot extension and supervised Arabic baselines (AraBERT and MARBERT) for contextual comparison. Results showthat GPT-4o and OpenAI-o3 achieve the strongest overall zero-shot performance, while few-shot prompting improves performancefor most models, particularly in accuracy and macro-F1, though gains are not fully uniform across systems. Importantly, wedemonstrate that predictive performance alone is insufficient to fully characterise real-world model behaviour, as reliability metricsreveal meaningful differences in output validity and deployment readiness. These findings highlight the importance of reliabilityawareevaluation for Arabic NLP and provide a more realistic framework for assessing LLMs in deployment-oriented scenarios.</p>
</div></span></div><div class="tw-flex tw-flex-wrap tw-pb-3"><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><a href="/browse?subjectArea=Biological%20sciences%2FComputational%20biology%20and%20bioinformatics" class="tw-text-blue-600 hover:tw-text-blue-800 hover:tw-underline"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-blue-50 hover:tw-bg-blue-100 tw-transition">Biological sciences/Computational biology and bioinformatics</span></a></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><a href="/browse?subjectArea=Physical%20sciences%2FMathematics%20and%20computing" class="tw-text-blue-600 hover:tw-text-blue-800 hover:tw-underline"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-blue-50 hover:tw-bg-blue-100 tw-transition">Physical sciences/Mathematics and computing</span></a></p></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100"><div class="tw-flex tw-items-start tw-justify-between"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full tw-px-4"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Full Text</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus: e","fulltext":[],"fulltextSource":"","fullText":"","funders":[],"hasAdminPriorityOnWorkflow":false,"hasManuscriptDocX":false,"hasOptedInToPreprint":true,"hasPassedJournalQc":"","hasAnyPriority":false,"hideJournal":false,"highlight":"","institution":"","isAcceptedByJournal":true,"isAuthorSuppliedPdf":true,"isDeskRejected":"","isHiddenFromSearch":false,"isInQc":false,"isInWorkflow":false,"isPdf":true,"isPdfUpToDate":true,"isWithdrawnOrRetracted":false,"journal":{"display":true,"email":"info@researchsquare.com","identity":"scientific-reports","isNatureJournal":false,"hasQc":true,"allowDirectSubmit":false,"externalIdentity":"scirep","sideBox":"Learn more about [Scientific Reports](http://www.nature.com/srep/)","snPcode":"","submissionUrl":"","title":"Scientific Reports","twitterHandle":"","acdcEnabled":true,"dfaEnabled":true,"editorialSystem":"stoa","reportingPortfolio":"Scientific Reports","inReviewEnabled":true,"inReviewRevisionsEnabled":true},"keywords":"","lastPublishedDoi":"10.21203/rs.3.rs-9427998/v1","lastPublishedDoiUrl":"https://doi.org/10.21203/rs.3.rs-9427998/v1","license":{"name":"CC BY 4.0","url":"https://creativecommons.org/licenses/by/4.0/"},"manuscriptAbstract":"Large Language Models (LLMs) are increasingly applied to emotion classification, yet Arabic benchmarks remain limited and oftenfocus solely on predictive performance. This work introduces a reliability-aware perspective through an abstention-aware benchmarkfor Arabic emotion classification. The benchmark is based on 1002 manually annotated sentences across five emotion categories,with very high inter-annotator agreement (κ = 0.9722). Our framework evaluates multiple LLMs under a unified zero-shot settingand explicitly models reliability through coverage, unknown-rate, and strict versus covered evaluation protocols. We further include acontrolled few-shot extension and supervised Arabic baselines (AraBERT and MARBERT) for contextual comparison. Results showthat GPT-4o and OpenAI-o3 achieve the strongest overall zero-shot performance, while few-shot prompting improves performancefor most models, particularly in accuracy and macro-F1, though gains are not fully uniform across systems. Importantly, wedemonstrate that predictive performance alone is insufficient to fully characterise real-world model behaviour, as reliability metricsreveal meaningful differences in output validity and deployment readiness. These findings highlight the importance of reliabilityawareevaluation for Arabic NLP and provide a more realistic framework for assessing LLMs in deployment-oriented scenarios.","manuscriptTitle":"Reliability-Aware Benchmarking of Large Language Models for Arabic Emotion Classification: Beyond Accuracy","msid":"","msnumber":"","nonDraftVersions":[{"code":1,"date":"2026-05-20 05:18:17","doi":"10.21203/rs.3.rs-9427998/v1","editorialEvents":[{"type":"communityComments","content":0},{"type":"decision","content":"Revision requested","date":"2026-07-13T11:43:42+00:00","index":"","fulltext":""},{"type":"editorInvitedReview","content":"","date":"2026-07-02T04:45:25+00:00","index":"hide","fulltext":""},{"type":"reviewerAgreed","content":"97189140424818649986689306960434680820","date":"2026-07-01T19:39:41+00:00","index":"hide","fulltext":""},{"type":"editorInvitedReview","content":"","date":"2026-07-01T02:34:23+00:00","index":"hide","fulltext":""},{"type":"reviewerAgreed","content":"65943142315040000633237015876020970460","date":"2026-07-01T02:08:51+00:00","index":"hide","fulltext":""},{"type":"editorInvitedReview","content":"","date":"2026-06-02T19:23:45+00:00","index":"hide","fulltext":""},{"type":"reviewerAgreed","content":"198292873668464451436545329670880603878","date":"2026-05-12T07:13:01+00:00","index":"hide","fulltext":""},{"type":"reviewerAgreed","content":"22793707194479322004275196452295069940","date":"2026-05-11T19:49:14+00:00","index":"hide","fulltext":""},{"type":"reviewersInvited","content":"","date":"2026-05-11T17:34:55+00:00","index":"","fulltext":""},{
